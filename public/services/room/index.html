<!doctype html><html><head><meta charset="utf-8">
<title>Services room</title>
<!--
  The /services hero (components/services/room.tsx loads this page in a fixed, full-screen frame).
  A dark room seen straight on, at eye level with a man-height screen standing against the back
  wall. The screen loops our services (a title card, then Websites, Brand, 3D, Campaigns and
  Research over our own stills and films, loop.js) with glitch cuts between them. To its right a
  kid sits cross-legged typing at a Macintosh that shows the same loop, cables all over the floor.
  The screen is the room's light: a RectAreaLight that follows the loop's average colour and
  flickers on each glitch, a soft spill on the wall behind the kid and a little light from the
  Mac. Bloom, grain, a vignette and a light frame glitch on top.

  Built in .plannotator/services/hero/room.html, which keeps the debug views and tuning overrides.

  Models (CC BY 4.0, credit on public use):
    kid: "Black Boy Rigged Ready For Ue4" on Sketchfab
         https://sketchfab.com/3d-models/c9ded09156c244a6b0c3a29820e7f42a (posed here)
    mac: "Macintosh 128K" by connorwassall
         https://sketchfab.com/3d-models/macintosh-128k-c79a2a52d85a4c359c1944f6c638cf11

  ?t=<s> freezes time (screenshots); reduced motion freezes it too. The parent sets
  window.__paused while the page covers the scene, window.__scroll to how far it has scrolled (in
  screens) and window.__idle when nobody has scrolled for a while (the screen then shows the
  scroll-down card), and reads window.__ready.
-->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
</head><body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RectAreaLightUniformsLib } from "three/addons/lights/RectAreaLightUniformsLib.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { createLoop } from "./loop.js";

const qs = new URLSearchParams(location.search);
const num = (k, d) => (qs.has(k) ? parseFloat(qs.get(k)) : d);
// reduced motion gets one frame, mid title card, between glitches
const FIXED_T = qs.has("t") ? parseFloat(qs.get("t")) : matchMedia("(prefers-reduced-motion: reduce)").matches ? 1.6 : null;

// Every tuned number lives here. Units are metres.
const sh = num("screenH", 2.0), sw = sh * 16 / 9;
const P = {
  screen: { bottom: num("screenBottom", 0.1), z: -5.5 },
  // a ten-year-old, 1.4 m standing, sitting cross-legged right of the screen, turned `face`
  // degrees from the wall towards the screen; the Mac sits on the floor in front of them
  kid: { x: num("kidX", sw / 2 + 0.55), z: num("kidZ", -4.75), stand: 1.4, face: num("face", 35) },
  mac: { dist: num("macDist", 0.62), h: 0.34 },
  // eye level with the screen's centre, looking straight at the wall, so its edges stay parallel
  cam: { x: num("camX", 0.75), dist: num("camDist", 4.6), fov: num("fov", 40), drift: 0.12, fall: num("fall", 0.7) },
  light: num("light", 4),
  macGlow: num("macGlow", 3),
  rim: num("rim", 6),
  bloom: { strength: 0.5, radius: 0.6, threshold: 0.7 },
  // cap radius as a fraction of the skull's half-size, and how far it sits up the crown (of skull height)
  hair: { r: num("hairR", 0.8), up: num("hairUp", 0.12), back: num("hairBack", 0.35), curl: num("hairCurl", 0.05) },
};
const screenY = P.screen.bottom + sh / 2;
// the kid's facing: from the wall (-z) turned towards the screen (-x)
const UP = new THREE.Vector3(0, 1, 0);
const FACING = new THREE.Vector3(-Math.sin(P.kid.face * Math.PI / 180), 0, -Math.cos(P.kid.face * Math.PI / 180));
const LEFT = UP.clone().cross(FACING).normalize();

// Sitting cross-legged. Every body part gets an absolute direction in the kid's own frame,
// written as [forward, left, up] for the left side (the right mirrors it), and the knee and elbow
// facings are derived from where the shin and forearm go, so each joint can only bend the way a
// real one does. The back, neck and head are their standing rotation tipped forward.
const SIT = {
  thigh: [0.62, 0.76, -0.04],     // knees forward and apart, about level with the hips
  calf: { l: [-0.3, -0.94, -0.06], r: [-0.18, -0.97, 0.06] }, // shins cross, the right one on top (both written as left)
  foot: [0.45, -0.75, -0.45],     // feet tucked under the opposite knee
  upperarm: [0.32, 0.14, -0.94],  // arms hang, elbows a little forward
  lowerarm: [0.84, -0.36, -0.4],  // forearms forward and in, over the lap
  hand: [0.86, -0.22, -0.46],
  lean: { spine_01: 8, spine_02: 15, spine_03: 20, neck_01: 26, head: 40 }, // degrees from upright
};

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(P.cam.fov, 16 / 9, 0.05, 50);

// ---------- room ----------
const concrete = new THREE.MeshStandardMaterial({ color: 0x1a1a1c, roughness: 0.92 });
// matte floor, no reflection: the page scrolls up over the bottom of the scene
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x0c0c0d, roughness: 0.7 }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
const back = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), concrete);
back.position.set(0, 6, P.screen.z - 0.02);
scene.add(back);

// ---------- the screen and its loop ----------
const loop = await createLoop();
const loopTex = new THREE.CanvasTexture(loop.canvas);
loopTex.colorSpace = THREE.SRGBColorSpace;
loopTex.anisotropy = 8;

// Glitch: rows torn sideways, the channels pulled apart, block noise in the brand's mint, and
// scanlines; `g` is 0 between cuts. `crop` picks a window of the loop (the Mac's 3:2 CRT).
const glitchMat = (crop, scan) => new THREE.ShaderMaterial({
  uniforms: { tex: { value: loopTex }, g: { value: 0 }, t: { value: 0 }, crop: { value: new THREE.Vector4(...crop) }, gain: { value: 1.25 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tex; uniform float g, t, gain; uniform vec4 crop; varying vec2 vUv;
    float h(float n){ return fract(sin(n * 91.7) * 43758.5453); }
    vec3 at(vec2 u){ return texture2D(tex, crop.xy + clamp(u, 0., 1.) * crop.zw).rgb; }
    void main(){
      vec2 uv = vUv;
      float tick = floor(t * 24.);
      float rows = mix(10., 46., h(tick));
      float row = floor(uv.y * rows);
      float tear = step(1. - .55 * g, h(row + tick * 3.1));
      uv.x += (h(row * 7.3 + tick) - .5) * .22 * g * tear;
      float split = .002 + .02 * g;
      vec3 c = vec3(at(uv + vec2(split, 0.)).r, at(uv).g, at(uv - vec2(split, 0.)).b);
      vec2 cell = floor(vUv * vec2(28., 16.));
      float blk = h(cell.x + cell.y * 28. + tick * 13.);
      c = mix(c, c.gbr * vec3(.6, 1.1, .9), step(1. - .03 * g, blk)); // a few cells swap channels
      c *= 1. - ${scan.toFixed(2)} * (.5 + .5 * sin(vUv.y * ${scan > 0.1 ? "900." : "1080."} * 3.14159));
      c *= 1. - .35 * g * step(.8, h(tick + row));
      gl_FragColor = vec4(c * gain, 1.);
    }`,
});
const screenMat = glitchMat([0, 0, 1, 1], 0.06);
const screen = new THREE.Mesh(new THREE.PlaneGeometry(sw, sh), screenMat);
screen.position.set(0, screenY, P.screen.z);
scene.add(screen);
const area = new THREE.RectAreaLight(0x9fbfe0, P.light, sw, sh);
area.position.set(0, screenY, P.screen.z + 0.01);
area.lookAt(0, screenY, 10);
scene.add(area);

// the loop's average colour lights the room, read from an 8x8 copy every few frames
const probe = document.createElement("canvas"); probe.width = probe.height = 8;
const pctx = probe.getContext("2d", { willReadFrequently: true });
const avg = new THREE.Color();
function sampleColour() {
  pctx.drawImage(loop.canvas, 0, 0, 8, 8);
  const d = pctx.getImageData(0, 0, 8, 8).data; let r = 0, g = 0, b = 0;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
  avg.setRGB(r / 64 / 255, g / 64 / 255, b / 64 / 255, THREE.SRGBColorSpace);
  // lift dark cards so the room never goes fully black
  avg.lerp(new THREE.Color(0x8fa9c4), 0.35);
}

// ---------- kid and Mac ----------
// Hair has no highlight at all: Lambert, near black, so the light from the screen never shines on it.
const hairMat = new THREE.MeshLambertMaterial({ color: 0x181513 });
const macLight = new THREE.PointLight(0x9fbfe0, P.macGlow, 2.2, 1.6); // lights the hands and face
scene.add(macLight);
// spill from the screen's right edge: outlines the kid's back so they read against the wall
const rim = new THREE.SpotLight(0x9fbfe0, P.rim, 6, 0.6, 0.6, 1.2);
rim.position.set(sw / 2 - 0.3, screenY + 0.3, P.screen.z + 0.35);
rim.target.position.set(P.kid.x, 0.45, P.kid.z);
scene.add(rim, rim.target);
// The screen's spill along the wall to its right: a soft glow behind the kid, so their head reads
// as a silhouette against it without any light on the head itself.
const wash = new THREE.SpotLight(0x9fbfe0, num("wash", 6), 5, 0.9, 1, 1.4);
wash.position.set(sw / 2 - 0.2, screenY * 0.6, P.screen.z + 0.9);
wash.target.position.set(sw / 2 + 1.4, screenY * 0.5, P.screen.z);
scene.add(wash, wash.target);

/** centre a model on x/z, stand it on the floor and scale it to height h */
function place(root, { x, z, h, yaw }) {
  const box = new THREE.Box3().setFromObject(root);
  const g = new THREE.Group();
  root.position.set(-(box.min.x + box.max.x) / 2, -box.min.y, -(box.min.z + box.max.z) / 2);
  g.add(root); g.scale.setScalar(h / box.getSize(new THREE.Vector3()).y); g.rotation.y = yaw; g.position.set(x, 0, z);
  scene.add(g);
  return g;
}
// Bind (standing) world rotations and positions, recorded before posing.
const BIND = new Map(), BINDP = new Map();
/** rotation matrix with columns d, a (made perpendicular to d) and d x a */
function basis(d, a) {
  const x = d.clone().normalize(), y = a.clone().addScaledVector(x, -a.dot(x)).normalize();
  return new THREE.Matrix4().makeBasis(x, y, x.clone().cross(y));
}
/** world rotation `w` for `bone`, written as a local rotation under its (already posed) parent */
function setWorld(bone, w) {
  bone.parent.updateWorldMatrix(true, false);
  bone.quaternion.copy(bone.parent.getWorldQuaternion(new THREE.Quaternion()).invert().multiply(w));
  bone.updateWorldMatrix(false, true);
}
/** turn `bone` from its bind rotation so its line to `tip` runs along `dir`, and its bind `ref`
    axis (perpendicular to that line when standing) turns to `refTo` */
function orient(bone, tip, ref, dir, refTo) {
  const d0 = BINDP.get(tip).clone().sub(BINDP.get(bone));
  const r = basis(dir, refTo).multiply(basis(d0, ref).transpose());
  setWorld(bone, new THREE.Quaternion().setFromRotationMatrix(r).multiply(BIND.get(bone)));
}
const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _p = new THREE.Quaternion();
/** rotate `bone` from its posed rotation `base` by `angle` about a world axis */
const _d = new THREE.Quaternion();
function nudge(bone, base, axis, angle) {
  bone.parent.updateWorldMatrix(true, false);
  bone.parent.getWorldQuaternion(_p);
  _d.setFromAxisAngle(axis, angle);
  // world = parent * base; new world = d * world; local = parent^-1 * new world
  bone.quaternion.copy(_p.clone().invert().multiply(_d).multiply(_p).multiply(base));
}

// Short curly hair: a cap of a sphere around the skull, pushed in and out by curls, tipped back
// so it comes lower at the back of the head than over the forehead.
function hairCap(radius) {
  const geo = new THREE.SphereGeometry(radius, 96, 48, 0, Math.PI * 2, 0, Math.PI * 0.6);
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).normalize();
    const c = Math.sin(v.x * 41) * Math.sin(v.y * 37 + 1.3) * Math.sin(v.z * 43 + 2.1)
            + 0.5 * Math.sin(v.x * 83 + v.z * 71) * Math.sin(v.y * 79);
    v.multiplyScalar(radius * (1 + P.hair.curl * (0.5 + 0.5 * c)));
    p.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

const bones = {}, base = {};
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const kidReady = loader.loadAsync("boy.glb").then((gltf) => {
  const root = gltf.scene;
  root.traverse((o) => {
    if (o.isBone) bones[o.name.replace(/_\d+$/, "")] = o;
    if (!o.isMesh) return;
    o.frustumCulled = false;
    // skin and cloth are matte: no metal, rough, no environment highlight
    const m = o.material;
    m.metalness = 0; m.roughness = num("skinRough", 0.88); m.envMapIntensity = 0;
    if (m.color) m.color.multiplyScalar(num("kidTone", 0.85));
  });
  // scale from the bind pose's standing height and turn the body to face FACING
  const box = new THREE.Box3().setFromObject(root);
  const g = new THREE.Group();
  g.add(root);
  g.scale.setScalar(P.kid.stand / box.getSize(_a).y);
  scene.add(g);
  g.updateMatrixWorld(true);
  // the bind pose's forward is where the toes point
  const fwdNow = bones.ball_l.getWorldPosition(new THREE.Vector3()).sub(bones.foot_l.getWorldPosition(new THREE.Vector3())).setY(0).normalize();
  g.rotation.y = Math.atan2(fwdNow.z, fwdNow.x) - Math.atan2(FACING.z, FACING.x);
  g.updateMatrixWorld(true);
  // which hip is on the body's left (rig labels can be mirrored)
  const lSide = bones.thigh_l.getWorldPosition(new THREE.Vector3()).sub(bones.thigh_r.getWorldPosition(new THREE.Vector3())).dot(LEFT) > 0 ? "l" : "r";
  root.traverse((o) => BIND.set(o, o.getWorldQuaternion(new THREE.Quaternion())));

  root.traverse((o) => BINDP.set(o, o.getWorldPosition(new THREE.Vector3())));
  // pose: [forward, left, up] in the kid's frame, left mirrored to right
  const V = (side, [f, l, u]) => FACING.clone().multiplyScalar(f)
    .addScaledVector(LEFT, side === lSide ? l : -l).addScaledVector(UP, u).normalize();
  const swing = (from, to, v) => v.clone().applyQuaternion(new THREE.Quaternion().setFromUnitVectors(from, to));
  // the back first: the arms hang from it
  const tip = UP.clone().cross(FACING).normalize(); // + turns up towards forward
  for (const [n, deg] of Object.entries(SIT.lean)) {
    setWorld(bones[n], new THREE.Quaternion().setFromAxisAngle(tip, deg * Math.PI / 180).multiply(BIND.get(bones[n])));
  }
  for (const side of ["l", "r"]) {
    const b = (n) => bones[`${n}_${side}`];
    const thigh = V(side, SIT.thigh), shin = V(side, SIT.calf[side === lSide ? "l" : "r"]);
    const knee = shin.clone().addScaledVector(thigh, -shin.dot(thigh)).negate().normalize(); // kneecap faces away from the fold
    orient(b("thigh"), b("calf"), FACING, thigh, knee);
    orient(b("calf"), b("foot"), FACING, shin, swing(thigh, shin, knee));
    orient(b("foot"), b("ball"), UP, V(side, SIT.foot), shin.clone().negate()); // top of the foot towards the knee
    const upper = V(side, SIT.upperarm), fore = V(side, SIT.lowerarm);
    const crease = fore.clone().addScaledVector(upper, -fore.dot(upper)).normalize(); // elbow crease faces the fold
    orient(b("upperarm"), b("lowerarm"), FACING, upper, crease);
    orient(b("lowerarm"), b("hand"), FACING, fore, swing(upper, fore, crease));
    orient(b("hand"), b("middle_01"), UP.clone().negate(), V(side, SIT.hand), UP.clone().negate()); // palm down
  }
  // stand the posed body on the floor at (x, z)
  root.traverse((o) => { if (o.isSkinnedMesh) o.boundingBox = null; });
  g.updateMatrixWorld(true);
  const posed = new THREE.Box3().setFromObject(g, true);
  g.position.set(P.kid.x - (posed.min.x + posed.max.x) / 2, -posed.min.y, P.kid.z - (posed.min.z + posed.max.z) / 2);
  g.updateMatrixWorld(true);

  // Hair. The rig's head_end bone doesn't point at the crown, so the skull is measured from the
  // mesh: the posed vertices skinned mostly to the head bone give its centre and size, and the
  // line from the neck to that centre is the crown's direction.
  const head = bones.head;
  const skull = new THREE.Box3(), v = new THREE.Vector3();
  root.traverse((o) => {
    if (!o.isSkinnedMesh) return; // eyes and lashes are inside the head too
    const hi = o.skeleton.bones.indexOf(head), si = o.geometry.attributes.skinIndex, sw = o.geometry.attributes.skinWeight;
    for (let i = 0; i < si.count; i++) {
      let w = 0;
      for (let k = 0; k < 4; k++) if (si.getComponent(i, k) === hi) w += sw.getComponent(i, k);
      if (w > 0.6) skull.expandByPoint(o.localToWorld(o.getVertexPosition(i, v)));
    }
  });
  const centre = skull.getCenter(new THREE.Vector3()), size = skull.getSize(new THREE.Vector3());
  bones.neck_01.getWorldPosition(_a);
  const up = centre.clone().sub(_a).normalize();
  const backDir = FACING.clone().negate().addScaledVector(up, FACING.dot(up)).normalize(); // the back of the head
  const hair = new THREE.Mesh(hairCap(Math.max(size.x, size.y, size.z) / 2 * P.hair.r), hairMat);
  hair.position.copy(centre).addScaledVector(up, P.hair.up * size.y);
  hair.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up.clone().addScaledVector(backDir, P.hair.back).normalize());
  scene.add(hair);
  head.attach(hair);
});
const macReady = loader.loadAsync("mac.glb").then((gltf) => {
  gltf.scene.traverse((o) => { if (o.isMesh) o.material.color?.multiplyScalar(0.25); });
  // the loop on the Mac's CRT: a 3:2 plane (the 128K is 512x342) cropped from the 16:9 loop,
  // measured in the model's own space before placing, where the Mac's front is -z
  let body; gltf.scene.traverse((o) => { if (o.isMesh && /Mac/.test(o.name)) body = o; });
  gltf.scene.updateMatrixWorld(true);
  const mb = new THREE.Box3().setFromObject(body);
  const mw = mb.max.x - mb.min.x, mh = mb.max.y - mb.min.y;
  const cropW = (3 / 2) / (16 / 9);
  const sW = mw * 0.62, sH = sW / 1.5;
  const crt = new THREE.Mesh(new THREE.PlaneGeometry(sW, sH), glitchMat([(1 - cropW) / 2, 0, cropW, 1], 0.18));
  crt.position.set((mb.min.x + mb.max.x) / 2, mb.min.y + mh * 0.64, mb.min.z - 0.005);
  crt.rotation.y = Math.PI; // face -z
  gltf.scene.add(crt);
  // in front of the kid, its screen (local -z) turned to face them
  const at = new THREE.Vector3(P.kid.x, 0, P.kid.z).addScaledVector(FACING, P.mac.dist);
  place(gltf.scene, { x: at.x, z: at.z, h: P.mac.h, yaw: Math.atan2(FACING.x, FACING.z) });
  scene.updateMatrixWorld(true); // the group place() made, not just the model under it
  macLight.position.copy(crt.position).add(new THREE.Vector3(0, 0, -0.4)).applyMatrix4(gltf.scene.matrixWorld);
  let keys, mouse;
  gltf.scene.traverse((o) => { if (o.isMesh && /Keyboard/.test(o.name)) keys = o; if (o.isMesh && /Mouse/.test(o.name)) mouse = o; });
  return { crtMat: crt.material, keys, mouse };
});
const [, { crtMat, keys, mouse }] = await Promise.all([kidReady, macReady]).catch((e) => { document.title = `failed: ${e.message}`; throw e; });

// The keyboard rests on the kid's lap under their hands; the mouse and its cord are hidden.
// The typing motion is measured from this pose, about each wrist's own flexion axis.
const WRIST = {};
{
  scene.updateMatrixWorld(true);
  const hl = bones.hand_l.getWorldPosition(new THREE.Vector3()), hr = bones.hand_r.getWorldPosition(new THREE.Vector3());
  const target = hl.clone().add(hr).multiplyScalar(0.5).addScaledVector(FACING, num("keysAhead", 0.06));
  target.y = Math.min(hl.y, hr.y) - num("keysBelow", 0.05);
  const kb = new THREE.Box3().setFromObject(keys), centre = kb.getCenter(new THREE.Vector3());
  centre.y = kb.max.y;
  const wp = keys.getWorldPosition(new THREE.Vector3()).add(target.sub(centre));
  keys.position.copy(keys.parent.worldToLocal(wp));
  mouse.visible = false;
  for (const s of ["l", "r"]) {
    const dir = bones[`middle_01_${s}`].getWorldPosition(new THREE.Vector3()).sub(bones[`hand_${s}`].getWorldPosition(new THREE.Vector3()));
    WRIST[s] = dir.cross(UP.clone().negate()).normalize(); // + tips the fingers down
  }
  for (const b of ["hand_l", "hand_r", "head", "neck_01"]) base[b] = bones[b].quaternion.clone();
}

// ---------- mouse, cables and a power strip ----------
// Cables are tubes along Catmull-Rom curves that lie on the floor (y = radius) and wander side to
// side; they leave the devices from a little above the floor. The keyboard's is coiled.
{
  const R = LEFT.clone().negate();
  const at = (v, f, r, y = 0) => v.clone().addScaledVector(FACING, f).addScaledVector(R, r).setY(y);
  const kid = new THREE.Vector3(P.kid.x, 0, P.kid.z);
  const mac = kid.clone().addScaledVector(FACING, P.mac.dist);
  const rubber = new THREE.MeshStandardMaterial({ color: 0x0c0c0d, roughness: 0.62 });
  const beige = new THREE.MeshStandardMaterial({ color: 0x3b3830, roughness: 0.7 }); // the Mac's plastic, as darkened above
  let seed = 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };

  /** a floor cable from a to b through optional waypoints, wandering by `wander` metres */
  function cable(pts, radius = 0.006, mat = rubber, wander = 0.08) {
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1], n = Math.max(2, Math.round(a.distanceTo(b) / 0.18));
      const side = new THREE.Vector3(-(b.z - a.z), 0, b.x - a.x).normalize();
      for (let k = 0; k < n; k++) {
        const t = k / n, p = a.clone().lerp(b, t);
        const off = (k === 0 && i === 0) ? 0 : Math.sin(t * Math.PI * 2 + rnd() * 6) * wander * (0.4 + rnd());
        p.addScaledVector(side, off);
        // ends keep their height, the rest lies on the floor
        p.y = (i === 0 && k === 0) ? a.y : radius;
        out.push(p);
      }
    }
    out.push(pts[pts.length - 1].clone());
    const curve = new THREE.CatmullRomCurve3(out, false, "centripetal");
    const m = new THREE.Mesh(new THREE.TubeGeometry(curve, out.length * 12, radius, 8, false), mat);
    scene.add(m);
    return curve;
  }
  /** a coiled cable: a helix around a sagging path from a to b */
  function coil(a, b, mat) {
    const mid = a.clone().lerp(b, 0.5); mid.y = 0.012;
    const path = new THREE.CatmullRomCurve3([a, a.clone().lerp(mid, 0.5).setY(0.03), mid, b.clone().lerp(mid, 0.5).setY(0.02), b]);
    const n = 260, frames = path.computeFrenetFrames(n, false), pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, c = path.getPointAt(t), turn = t * 70 * Math.PI * 2, r = 0.009;
      pts.push(c.clone().addScaledVector(frames.normals[i], Math.cos(turn) * r).addScaledVector(frames.binormals[i], Math.sin(turn) * r));
    }
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), n * 4, 0.0022, 6, false), mat));
  }

  // the Mac 128K mouse, beige, one button, on the floor
  const m = new THREE.Mesh(new RoundedBoxGeometry(0.062, 0.034, 0.1, 3, 0.012), beige);
  m.position.copy(at(kid, 0.34, -0.3, 0.017)); // by the keyboard on the kid's left, the side the camera sees
  m.rotation.y = Math.atan2(FACING.x, FACING.z) - 0.25;
  scene.add(m);

  const kb = new THREE.Box3().setFromObject(keys), kbc = kb.getCenter(new THREE.Vector3());
  const macBack = at(mac, 0.15, 0.02, 0.05), macFront = at(mac, -0.13, -0.05, 0.02);
  coil(kbc.clone().addScaledVector(FACING, 0.07).setY(kb.min.y + 0.01), macFront, beige);
  cable([at(kid, 0.39, -0.3, 0.02), at(kid, 0.5, -0.36), at(mac, 0.05, -0.24), macBack.clone().addScaledVector(R, -0.05)], 0.0028, beige, 0.05);

  // power strip against the wall right of the kid, everything runs to it
  const strip = new THREE.Mesh(new RoundedBoxGeometry(0.32, 0.045, 0.07, 2, 0.008), rubber);
  const stripAt = new THREE.Vector3(sw / 2 + 1.1, 0.023, P.screen.z + 0.12);
  strip.position.copy(stripAt); strip.rotation.y = 0.12;
  scene.add(strip);
  const plug = (k) => stripAt.clone().add(new THREE.Vector3(-0.12 + k * 0.08, 0.02, 0.03));
  cable([macBack, at(mac, 0.35, 0.3), new THREE.Vector3(stripAt.x - 0.4, 0, stripAt.z + 0.35), plug(0)], 0.0045);
  // the big screen's feeds: two thick cables from its bottom right corner
  cable([new THREE.Vector3(sw / 2 - 0.15, 0.06, P.screen.z + 0.03), new THREE.Vector3(sw / 2 + 0.2, 0, P.screen.z + 0.4), new THREE.Vector3(stripAt.x - 0.6, 0, stripAt.z + 0.2), plug(1)], 0.009, rubber, 0.1);
  cable([new THREE.Vector3(sw / 2 - 0.3, 0.06, P.screen.z + 0.03), new THREE.Vector3(sw / 2 - 0.1, 0, P.screen.z + 0.7), at(kid, -0.35, -0.2), new THREE.Vector3(stripAt.x - 0.2, 0, stripAt.z + 0.5), plug(2)], 0.008, rubber, 0.12);
  // the strip's own lead, off to the right
  cable([plug(3).setX(stripAt.x + 0.16), new THREE.Vector3(stripAt.x + 0.7, 0, stripAt.z + 0.25), new THREE.Vector3(sw / 2 + 3, 0, P.screen.z + 0.6)], 0.005);
  // loose cables across the floor in front of the screen
  cable([new THREE.Vector3(-sw / 2 - 0.4, 0, P.screen.z + 0.5), new THREE.Vector3(-0.8, 0, P.screen.z + 1.0), new THREE.Vector3(0.6, 0, P.screen.z + 0.7), new THREE.Vector3(sw / 2 + 0.3, 0, P.screen.z + 1.1), at(kid, -0.5, -0.4)], 0.006, rubber, 0.15);
  cable([new THREE.Vector3(-0.3, 0.06, P.screen.z + 0.03), new THREE.Vector3(-0.1, 0, P.screen.z + 0.6), new THREE.Vector3(1.2, 0, P.screen.z + 1.5), new THREE.Vector3(2.6, 0, P.screen.z + 1.9), new THREE.Vector3(sw / 2 + 2.5, 0, P.screen.z + 1.4)], 0.007, rubber, 0.18);
  cable([new THREE.Vector3(-sw / 2 + 0.2, 0.06, P.screen.z + 0.03), new THREE.Vector3(-sw / 2 - 0.2, 0, P.screen.z + 0.9), new THREE.Vector3(-sw / 2 - 1.5, 0, P.screen.z + 1.3)], 0.008, rubber, 0.12);
}

// ---------- post ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), P.bloom.strength, P.bloom.radius, P.bloom.threshold));
// vignette and grain, and on the cuts a lighter glitch of the whole frame
const film = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, t: { value: 0 }, g: { value: 0 }, res: { value: new THREE.Vector2() } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float t, g; uniform vec2 res; varying vec2 vUv;
    float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    float h(float n){ return fract(sin(n * 91.7) * 43758.5453); }
    void main(){
      vec2 uv = vUv;
      float tick = floor(t * 24.), row = floor(uv.y * 30.);
      uv.x += (h(row + tick * 5.) - .5) * .03 * g * step(.82, h(row * 3. + tick));
      float s = .004 * g;
      vec3 c = vec3(texture2D(tDiffuse, uv + vec2(s, 0.)).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv - vec2(s, 0.)).b);
      vec2 d = vUv - .5; d.x *= res.x / res.y;
      c *= 1. - smoothstep(.45, 1.15, length(d)) * .75;
      c += (h21(vUv * res + fract(t * 7.3) * 91.) - .5) * .045;
      gl_FragColor = vec4(c, 1.);
    }`,
});
composer.addPass(film);
composer.addPass(new OutputPass());

const view = { x: P.cam.x, dist: P.cam.dist };
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  // Narrower than the desktop frame (phones), the camera backs off until the screen's left edge
  // and the kid both fit the width, centred between them, still at eye level.
  const left = -sw / 2 - 0.25, right = P.kid.x + 0.45, tanW = Math.tan(P.cam.fov * Math.PI / 360) * camera.aspect;
  const need = (right - left) / 2 / tanW;
  view.x = need > P.cam.dist ? (left + right) / 2 : P.cam.x;
  view.dist = Math.max(P.cam.dist, need);
  film.uniforms.res.value.set(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
}
addEventListener("resize", resize);
resize();

// ---------- motion ----------
const hash = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
/** one key press per slot on a hand: rises and falls in the first part of the slot, some slots rest */
function press(t, rate, seed) {
  const k = Math.floor(t * rate + seed), u = t * rate + seed - k;
  return hash(k * 1.7 + seed * 13) > 0.3 ? Math.sin(Math.min(u / 0.55, 1) * Math.PI) ** 2 : 0;
}
function type(t) {
  // slow bursts of typing; every few seconds a pause, when the kid looks up at the screen
  const cycle = t % 6, typing = cycle < 4.8 ? 1 : 0;
  const look = Math.sin(Math.min(Math.max((cycle - 4.8) / 1.2, 0), 1) * Math.PI);
  for (const [s, rate, seed] of [["l", 2.6, 0], ["r", 3.0, 0.5]]) { // keys per second, per hand
    const p = press(t, rate, seed) * typing;
    nudge(bones[`hand_${s}`], base[`hand_${s}`], WRIST[s], (-4 + 9 * p) * Math.PI / 180); // + tips the fingers down
  }
  nudge(bones.neck_01, base.neck_01, UP.clone().cross(FACING).normalize(), -12 * look * Math.PI / 180); // - lifts the chin
  nudge(bones.head, base.head, UP, 14 * look * Math.PI / 180); // + turns towards the screen, on the kid's left
}

const pointer = new THREE.Vector2(), drift = new THREE.Vector2();
addEventListener("pointermove", (e) => pointer.set(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1));
const t0 = performance.now();
let frameNo = 0, descent = 0;
function frame() {
  // covered by the page: render nothing, stop the film, check again next frame
  if (window.__paused && FIXED_T === null) { loop.pause(); requestAnimationFrame(frame); return; }
  const t = FIXED_T ?? (performance.now() - t0) / 1000;
  const { glitch } = loop.update(t, FIXED_T === null && window.__idle === true);
  loopTex.needsUpdate = true;
  for (const m of [screenMat, crtMat]) { m.uniforms.g.value = glitch; m.uniforms.t.value = t; }
  if (frameNo++ % 4 === 0) {
    sampleColour();
    area.color.copy(avg); rim.color.copy(avg); macLight.color.copy(avg); wash.color.copy(avg);
  }
  // the room flickers with the screen on each glitch
  const flick = 1 - 0.55 * glitch * hash(Math.floor(t * 24));
  area.intensity = P.light * flick; rim.intensity = P.rim * flick; wash.intensity = num("wash", 6) * flick;
  film.uniforms.g.value = glitch * 0.6; film.uniforms.t.value = t;
  type(t);

  // camera: slides with the cursor but always looks straight at the wall
  drift.lerp(pointer, 0.04);
  const sway = FIXED_T === null ? Math.sin(t * 0.25) * 0.03 : 0;
  // Scrolling the page lowers the camera, basement's way: over the first screen of scroll it sinks
  // P.cam.fall metres, still level, so the room slides up past you and the floor rises fastest.
  descent += (Math.min(Math.max(window.__scroll ?? 0, 0), 1) - descent) * (FIXED_T === null ? 0.12 : 1);
  camera.position.set(view.x + drift.x * P.cam.drift + sway, screenY - drift.y * P.cam.drift * 0.4 - P.cam.fall * descent, P.screen.z + view.dist);
  camera.lookAt(camera.position.x, camera.position.y, P.screen.z);
  composer.render();
  if (FIXED_T === null) requestAnimationFrame(frame);
}
frame();
requestAnimationFrame(() => { window.__ready = true; });
</script></body></html>
