<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Self-attention visualization</title>
  <style>
    @font-face {
      font-family: "Search System Pro Mono";
      src: url("/fonts/search-system-pro-mono.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    :root {
      --color-surface-default: #ecece8;
      --color-text-default: #111;
      --grid-margin: 24px;
      --layout-max-width: 1752px;
      --landing-caption-bottom: 132px;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { background: transparent; }
    self-attention { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <script>
    // The host passes its own ink, ground and scheme (?ink=&paper=&scheme=);
    // without them the light defaults above apply.
    (function (params, root) {
      var ink = params.get("ink"), paper = params.get("paper"), scheme = params.get("scheme");
      if (ink) root.style.setProperty("--color-text-default", ink);
      if (paper) root.style.setProperty("--color-surface-default", paper);
      if (scheme === "dark" || scheme === "light") root.style.colorScheme = scheme;
    })(new URLSearchParams(location.search), document.documentElement);
  </script>
  <self-attention src="./paragraph-traces.json"></self-attention>
  <script type="module" src="./engine.js"></script>
  <script>
    // Keep page shortcuts available while the speed control has focus.
    addEventListener("keydown", (event) => {
      if (event.metaKey || event.ctrlKey || ["k", "m", "c", "Escape"].includes(event.key)) {
        parent.dispatchEvent(new KeyboardEvent("keydown", {
          key: event.key, metaKey: event.metaKey, ctrlKey: event.ctrlKey,
          altKey: event.altKey, shiftKey: event.shiftKey,
        }));
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") event.preventDefault();
      }
    });
    addEventListener("pointermove", (event) => {
      const rect = window.frameElement?.getBoundingClientRect();
      if (!rect) return;
      parent.dispatchEvent(new MouseEvent("mousemove", {
        clientX: event.clientX + rect.left,
        clientY: event.clientY + rect.top,
      }));
    });
  </script>
</body>
</html>
