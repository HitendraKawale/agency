<!doctype html><html><head><meta charset="utf-8">
<title>CRT wall</title>
<!--
  The /people CRT wall (components/people/wall.tsx loads this page in a full-screen frame between
  the intro and the values). A pile of old CRT televisions stacked against the dark, every screen
  playing our work: the Showcase montages and our own scenes. Every few seconds one set changes
  channel through static. The screens are the only light: three area lights in front of the pile
  take the average colour of the sets behind them and throw it on the floor.

  The sets are built here, not loaded: rounded plastic cases, a bulged glass screen with a CRT
  shader (barrel, scanlines, phosphor mask, rolling band, static), knobs, speaker slots, a red
  channel number that changes with the channel, a red button and a power light. VCRs flashing
  12:00 and boxes of test gear (rows of blinking lights, a counting readout) sit in the pile.

  ?t=<s> freezes time (screenshots); reduced motion freezes it too. The parent sets
  window.__paused while the wall is off screen or covered and window.__scroll to how far the next
  section has scrolled up over it (0 to 1, the camera sinks); it reads window.__ready.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
</head><body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from "three";
import { RectAreaLightUniformsLib } from "three/addons/lights/RectAreaLightUniformsLib.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const qs = new URLSearchParams(location.search);
const num = (k, d) => (qs.has(k) ? parseFloat(qs.get(k)) : d);
const FIXED_T = qs.has("t") ? parseFloat(qs.get("t")) : matchMedia("(prefers-reduced-motion: reduce)").matches ? 2 : null;

// Every clip the sets play: one montage per Showcase project, our own scenes, and our registry
// components (ui.aryank.space) recorded at 4:3 by .plannotator/people/tv-clips/record.sh.
const COMPONENTS = ["ascii-monogram-hero", "ascii-tv-hero", "cassette-tower", "drone-fleet", "fluid-refraction", "glyph-rain", "halftone-wave-hero", "lava-particle-field", "neon-iceberg", "odometer-load-hero", "particle-fluid-hero", "phatake", "pixel-cube-field", "pixel-smear-wordmark", "plasma-tunnel-background", "prism-light-instrument", "unfocused"];
const CLIPS = [
  "/showcase/parflow/montage.mp4",
  "/showcase/organic/montage.mp4",
  "/showcase/relay/montage.mp4",
  "/showcase/moneybee/montage.mp4",
  "/showcase/rainpulse/montage.mp4",
  "/showcase/ralsonics/montage.mp4",
  "/showcase/kitse/montage.mp4",
  "/showcase/yoinkd/montage.mp4",
  "/showcase/gov/montage.mp4",
  "/services/3d-bunker.mp4",
  "/services/3d-neon-sign.mp4",
  "/services/web-tunnel.mp4",
  "/services/web-dissolve.mp4",
  ...COMPONENTS.map((n) => `/people/clips/${n}.mp4`),
];

// Every tuned number lives here. Units are metres.
const P = {
  pile: { width: num("pileW", 7.2), seed: num("seed", 7) },
  // fall: how far the camera sinks while the next section scrolls up over the wall (services' way)
  cam: { fov: num("fov", 34), y: 1.35, dist: num("dist", 8.6), fall: num("fall", 0.8), drift: 0.3 },
  light: num("light", 1.4),
  bloom: { strength: num("bloom", 0.5), radius: 0.45, threshold: 0.82 },
  screen: { bright: num("bright", 0.95) },
};

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 9, 18);
const camera = new THREE.PerspectiveCamera(P.cam.fov, 16 / 9, 0.05, 60);

// seeded, so the pile is the same on every load
let seed = P.pile.seed;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const pick = (a) => a[Math.floor(rand() * a.length)];

// ---------- clips ----------
const videos = CLIPS.map((src) => {
  const v = document.createElement("video");
  Object.assign(v, { src, muted: true, loop: true, playsInline: true, preload: "auto" });
  v.setAttribute("muted", "");
  const tex = new THREE.VideoTexture(v);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  return { v, tex, aspect: 16 / 9, colour: new THREE.Color(0.2, 0.2, 0.22) };
});
// only the clips some set is showing play; the rest wait, loaded
const users = videos.map(() => 0);
const play = (c) => { if (FIXED_T === null && !window.__paused) c.v.play().catch(() => {}); };
for (const c of videos) {
  c.v.addEventListener("loadedmetadata", () => { c.aspect = c.v.videoWidth / c.v.videoHeight; });
  if (FIXED_T !== null) c.v.addEventListener("loadeddata", () => { c.v.currentTime = (FIXED_T * 1.7) % Math.max(c.v.duration || 10, 1); }, { once: true });
}
// average colour of each clip, read from a 4x4 copy every few frames
const probe = document.createElement("canvas");
probe.width = probe.height = 4;
const pctx = probe.getContext("2d", { willReadFrequently: true });
function sampleClip(c) {
  if (c.v.readyState < 2) return;
  pctx.drawImage(c.v, 0, 0, 4, 4);
  const d = pctx.getImageData(0, 0, 4, 4).data;
  let r = 0, g = 0, b = 0;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
  c.colour.setRGB(r / 16 / 255, g / 16 / 255, b / 16 / 255, THREE.SRGBColorSpace);
}

// ---------- the CRT screen ----------
const screenVert = /* glsl */`
  uniform float bulge; varying vec2 vUv;
  void main(){
    vUv = uv;
    vec2 c = uv * 2. - 1.;
    vec3 p = position;
    p.z += bulge * (1. - c.x * c.x * .7) * (1. - c.y * c.y * .7);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.);
  }`;
const screenFrag = /* glsl */`
  uniform sampler2D map; uniform float hasMap, aspect, clipAspect, t, noise, power, bright, mode, seed;
  varying vec2 vUv;
  float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float box(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
  vec3 bars(vec2 uv){
    float i = floor(uv.x * 7.);
    vec3 c = vec3(i < 4. ? 1. : 0., (i < 2. || (i > 3. && i < 6.)) ? 1. : 0., mod(i, 2.) < .5 ? 1. : 0.) * .75;
    if (uv.y < .25) c = vec3(h21(floor(uv * vec2(7., 1.)) + seed) * .2);
    return c;
  }
  void main(){
    // barrel: the picture bends with the glass
    vec2 c = vUv * 2. - 1.;
    c *= 1. + .045 * vec2(c.y * c.y, c.x * c.x);
    vec2 uv = c * .5 + .5;
    // rounded corners of the tube, black outside
    vec2 q = (uv - .5) * vec2(aspect, 1.);
    float edge = box(q, vec2(aspect, 1.) * .5, .07);
    if (edge > 0.) { gl_FragColor = vec4(vec3(.003), 1.); return; }

    // the clip, cropped to cover the screen
    vec2 s = vec2(1.);
    if (clipAspect > aspect) s.x = aspect / clipAspect; else s.y = clipAspect / aspect;
    vec2 tuv = (uv - .5) * s + .5;
    // a little horizontal tear while the channel changes
    float row = floor(uv.y * 60.), tick = floor(t * 30.);
    tuv.x += (h21(vec2(row, tick)) - .5) * .06 * noise;
    vec3 col = mode < .5 ? pow(texture2D(map, tuv).rgb, vec3(1.25)) * hasMap : mode < 1.5 ? vec3(0.) : bars(uv);

    // static
    float n = h21(floor(uv * vec2(260., 200.)) + fract(t * 13.) * 97. + seed);
    float still = mode > 0.5 && mode < 1.5 ? 1. : noise;
    col = mix(col, vec3(n * .8), still);
    // scanlines, phosphor mask, a rolling band and a slight flicker
    // both fade out when the set is small on screen, or they alias into rings
    float lines = 200., fl = fwidth(uv.y * lines);
    col *= mix(.8 + .2 * sin(uv.y * lines * 6.28318), 1., smoothstep(.2, .5, fl));
    float cols = 420., fm = fwidth(uv.x * cols), m = mod(floor(uv.x * cols), 3.);
    col *= mix(vec3(m == 0. ? 1.1 : .9, m == 1. ? 1.1 : .9, m == 2. ? 1.1 : .9), vec3(1.), smoothstep(.2, .5, fm));
    col *= 1. + .08 * smoothstep(.0, .08, .08 - abs(fract(uv.y - t * .11 + seed) - .5));
    col *= .97 + .03 * sin(t * 63. + seed * 10.);
    // darker towards the tube's edge
    col *= smoothstep(.0, -.12, edge) * .5 + .5;
    col *= smoothstep(0., -.02, edge);
    gl_FragColor = vec4(col * bright * power, 1.);
  }`;

// ---------- the sets ----------
const plastics = [
  new THREE.MeshStandardMaterial({ color: 0x232323, roughness: 0.45 }),
  new THREE.MeshStandardMaterial({ color: 0x2e2e2e, roughness: 0.55 }),
  new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.55 }),
  new THREE.MeshStandardMaterial({ color: 0x6a6a6a, roughness: 0.6 }),
  new THREE.MeshStandardMaterial({ color: 0x8c8c8c, roughness: 0.58 }),
];
const bezelMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.35 });
const knobMat = new THREE.MeshStandardMaterial({ color: 0x0c0c0c, roughness: 0.4, metalness: 0.3 });
const slotMat = new THREE.MeshStandardMaterial({ color: 0x020202, roughness: 0.9 });

// ---------- lights, buttons and readouts ----------
// LEDs share a few materials, each with its own rhythm (steady, blinking, pulsing, or the fast
// random flicker of a busy drive light), so a whole pile blinks out of step for a few draw calls.
const RED = new THREE.Color(0xd72f21), GREEN = new THREE.Color(0x86d9a6), AMBER = new THREE.Color(0xf6da75);
const hash = (n) => { const v = Math.sin(n * 127.1) * 43758.5453; return v - Math.floor(v); };
const leds = [];
function ledMat(c, kind) {
  const l = { m: new THREE.MeshBasicMaterial({ color: c.clone(), toneMapped: false }), c, kind, rate: 0.4 + rand() * 2.2, phase: rand(), duty: 0.25 + rand() * 0.5, seed: rand() * 100 };
  leds.push(l);
  return l.m;
}
const redLeds = [ledMat(RED, "steady"), ledMat(RED, "steady"), ...Array.from({ length: 6 }, () => ledMat(RED, "blink")), ledMat(RED, "pulse"), ledMat(RED, "pulse"), ...Array.from({ length: 4 }, () => ledMat(RED, "busy"))];
const otherLeds = [ledMat(GREEN, "steady"), ledMat(GREEN, "busy"), ledMat(GREEN, "blink"), ledMat(AMBER, "blink"), ledMat(AMBER, "busy")];
const standby = ledMat(RED, "blink");
function blink(t) {
  for (const l of leds) {
    const k = l.kind === "steady" ? 1
      : l.kind === "blink" ? ((t * l.rate + l.phase) % 1 < l.duty ? 1 : 0)
      : l.kind === "pulse" ? 0.5 + 0.5 * Math.sin((t * l.rate + l.phase) * 6.283)
      : hash(Math.floor(t * 9 * l.rate) + l.seed) > 0.45 ? 1 : 0;
    l.m.color.copy(l.c).multiplyScalar(0.05 + 2.4 * k);
  }
}
const ledGeo = new THREE.SphereGeometry(1, 12, 8);
function led(g, x, y, z, r, m) {
  const l = new THREE.Mesh(ledGeo, m);
  l.scale.set(r, r, r * 0.5); l.position.set(x, y, z); g.add(l);
}
const redButton = new THREE.MeshStandardMaterial({ color: 0xd72f21, roughness: 0.32, emissive: 0x4a0a06 });
const greyButton = new THREE.MeshStandardMaterial({ color: 0x9a9a9a, roughness: 0.4 });
function button(g, x, y, z, w, h, m, round) {
  const b = new THREE.Mesh(round ? new THREE.CylinderGeometry(w / 2, w / 2, h, 20) : new RoundedBoxGeometry(w, h, h * 0.8, 2, h * 0.2), m);
  if (round) b.rotation.x = Math.PI / 2;
  b.position.set(x, y, z + h * 0.35); g.add(b);
}

// seven-segment digits on a small canvas: the dim ghost of every segment, the lit ones in red
const SEG = { 0: "abcdef", 1: "bc", 2: "abged", 3: "abgcd", 4: "fgbc", 5: "afgcd", 6: "afgedc", 7: "abc", 8: "abcdefg", 9: "abcdfg", "-": "g", " ": "" };
function readout(g, x, y, z, w, h, chars) {
  const c = document.createElement("canvas");
  c.width = 12 + chars * 26; c.height = 48;
  const ctx = c.getContext("2d");
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshBasicMaterial({ map: tex, toneMapped: false });
  mat.color.setScalar(1.8);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); g.add(m);
  const seg = (ox, k, on) => {
    const oy = 6, dw = 18, dh = 36, t = 4, half = dh / 2 - t * 1.5;
    const R = { a: [ox + t, oy, dw - 2 * t, t], b: [ox + dw - t, oy + t, t, half], c: [ox + dw - t, oy + dh / 2 + t / 2, t, half], d: [ox + t, oy + dh - t, dw - 2 * t, t], e: [ox, oy + dh / 2 + t / 2, t, half], f: [ox, oy + t, t, half], g: [ox + t, oy + dh / 2 - t / 2, dw - 2 * t, t] };
    ctx.fillStyle = on ? "#ff4a35" : "#2a0705";
    ctx.fillRect(...R[k]);
  };
  const draw = (text) => {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#070101"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.setTransform(1, 0, -0.1, 1, 4, 0);
    let ox = 8;
    for (const ch of text) {
      if (ch === ":") { ctx.fillStyle = "#ff4a35"; ctx.fillRect(ox - 2, 16, 4, 4); ctx.fillRect(ox - 6, 30, 4, 4); ox += 6; continue; }
      for (const k of "abcdefg") seg(ox, k, (SEG[ch] ?? "").includes(k));
      ox += 26;
    }
    tex.needsUpdate = true;
  };
  return { draw, mat };
}
const pad = (n) => String(n).padStart(2, "0");

function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return new THREE.ShapeGeometry(s, 6);
}

const sets = [];
/** One television: w x h x d case; `panel` puts the knobs right of the screen or under it. */
function television(w, h, d, panel) {
  const g = new THREE.Group();
  const mat = pick(plastics);
  const body = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, Math.min(w, h) * 0.07), mat);
  g.add(body);
  // the tube's bell behind the case
  const bell = new THREE.Mesh(new RoundedBoxGeometry(w * 0.62, h * 0.62, d * 0.55, 2, 0.04), mat);
  bell.position.z = -d / 2 - d * 0.2;
  g.add(bell);

  const side = panel === "right" ? w * 0.22 : 0;
  const under = panel === "under" ? h * 0.16 : 0;
  const sw = (w - side) * 0.84, sh = Math.min((h - under) * 0.82, sw * 0.78);
  const cx = -side / 2, cy = under / 2, front = d / 2;

  const bezel = new THREE.Mesh(roundedRect(sw * 1.07, sh * 1.08, Math.min(sw, sh) * 0.09), bezelMat);
  bezel.position.set(cx, cy, front + 0.002);
  g.add(bezel);

  const uniforms = {
    map: { value: null }, hasMap: { value: 0 }, aspect: { value: sw / sh }, clipAspect: { value: 16 / 9 },
    t: { value: 0 }, noise: { value: 0 }, power: { value: 1 }, bright: { value: P.screen.bright },
    mode: { value: 0 }, seed: { value: rand() * 10 }, bulge: { value: Math.min(sw, sh) * 0.045 },
  };
  const screen = new THREE.Mesh(
    new THREE.PlaneGeometry(sw, sh, 20, 16),
    new THREE.ShaderMaterial({ uniforms, vertexShader: screenVert, fragmentShader: screenFrag, toneMapped: false }),
  );
  screen.position.set(cx, cy, front + 0.004);
  g.add(screen);

  // knobs and speaker slots
  const kr = Math.min(w, h) * 0.045;
  const knob = (x, y) => {
    const k = new THREE.Mesh(new THREE.CylinderGeometry(kr, kr * 1.05, kr * 0.9, 18), knobMat);
    k.rotation.x = Math.PI / 2; k.position.set(x, y, front + kr * 0.4); g.add(k);
  };
  const slots = (x, y, sw2, n, gap) => {
    for (let i = 0; i < n; i++) {
      const s = new THREE.Mesh(new THREE.BoxGeometry(sw2, kr * 0.18, 0.004), slotMat);
      s.position.set(x, y - i * gap, front + 0.001); g.add(s);
    }
  };
  // the channel number, a red button and the power light
  let channel = null;
  const power = pick(redLeds.slice(0, 2));
  let ledAt;
  if (panel === "right") {
    const px = w / 2 - side / 2 - w * 0.02;
    channel = readout(g, px, h * 0.36, front + 0.002, side * 0.62, side * 0.26, 2);
    knob(px, h * 0.2); knob(px, h * 0.04);
    slots(px, -h * 0.13, side * 0.6, 5, kr * 0.55);
    button(g, px - side * 0.14, -h * 0.37, front, kr * 1.4, kr * 0.8, redButton);
    ledAt = [px + side * 0.2, -h * 0.37];
  } else if (panel === "under") {
    const py = -h / 2 + under / 2 + h * 0.01;
    channel = readout(g, -w * 0.36, py, front + 0.002, w * 0.13, under * 0.5, 2);
    knob(w * 0.36, py); knob(w * 0.26, py);
    slots(-w * 0.04, py + kr * 0.6, w * 0.26, 3, kr * 0.55);
    button(g, w * 0.16, py, front, kr * 1.2, kr * 0.7, redButton, true);
    ledAt = [w * 0.09, py];
  } else {
    const py = -h / 2 + (h - sh * 1.08) / 4;
    button(g, w * 0.3, py, front, kr * 1.2, kr * 0.5, redButton);
    ledAt = [w * 0.4, py];
  }
  led(g, ledAt[0], ledAt[1], front + 0.004, kr * 0.28, power);
  const set = { g, uniforms, w, h, d, clip: -1, switchAt: -1, channel, power: g.children[g.children.length - 1] };
  sets.push(set);
  return set;
}

// ---------- old hardware ----------
// VCRs blinking 12:00, and boxes of test gear covered in lights, stacked in among the sets
const clocks = [], counters = [];
function vcr(w, h, d) {
  const g = new THREE.Group(), front = d / 2;
  g.add(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, 0.014), pick(plastics)));
  const slot = new THREE.Mesh(new THREE.BoxGeometry(w * 0.36, h * 0.15, 0.01), slotMat);
  slot.position.set(-w * 0.1, h * 0.14, front); g.add(slot);
  const flap = new THREE.Mesh(new THREE.BoxGeometry(w * 0.38, h * 0.3, 0.006), bezelMat);
  flap.position.set(-w * 0.1, h * 0.14, front - 0.001); g.add(flap);
  const clock = readout(g, w * 0.27, h * 0.14, front + 0.002, w * 0.2, h * 0.3, 4);
  clock.draw("12:00");
  clocks.push({ clock, phase: rand() });
  for (let i = 0; i < 5; i++) button(g, -w * 0.28 + i * w * 0.075, -h * 0.24, front, w * 0.05, h * 0.12, greyButton);
  button(g, w * 0.1, -h * 0.24, front, h * 0.17, h * 0.1, redButton, true);
  led(g, -w * 0.44, -h * 0.22, front + 0.004, h * 0.05, pick(redLeds));
  led(g, w * 0.42, -h * 0.22, front + 0.004, h * 0.05, pick(redLeds.slice(2)));
  return { g };
}
function rig(w, h, d) {
  const g = new THREE.Group(), front = d / 2;
  g.add(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, 0.012), pick(plastics)));
  const plate = new THREE.Mesh(new THREE.BoxGeometry(w * 0.94, h * 0.86, 0.006), bezelMat);
  plate.position.z = front; g.add(plate);
  // a block of lights on the left, a readout, toggles and a red button on the right
  const rows = h > 0.3 ? 3 : 2, cols = Math.max(6, Math.floor(w * 0.55 / 0.045)), r = Math.min(h * 0.04, 0.011);
  for (let i = 0; i < rows; i++)
    for (let j = 0; j < cols; j++)
      led(g, -w * 0.42 + j * 0.045, h * 0.25 - i * (h * 0.5 / Math.max(rows - 1, 1)), front + 0.006, r, rand() < 0.72 ? pick(redLeds) : pick(otherLeds));
  const counter = readout(g, w * 0.3, h * 0.2, front + 0.005, w * 0.24, h * 0.22, 3);
  const c = { counter, n: Math.floor(rand() * 900), rate: 0.15 + rand() * 0.5, next: 0 };
  counter.draw(String(c.n).padStart(3, "0"));
  counters.push(c);
  const tog = new THREE.MeshStandardMaterial({ color: 0xbdbdbd, roughness: 0.25, metalness: 0.8 });
  for (let i = 0; i < 3; i++) button(g, w * 0.2 + i * w * 0.07, -h * 0.2, front, h * 0.06, h * 0.14, tog, true);
  button(g, w * 0.4, -h * 0.2, front, h * 0.16, h * 0.1, redButton, true);
  return { g };
}

// ---------- consoles ----------
// The machines everyone had under the TV: the original Xbox, the first PlayStation, the NES, the
// N64 and the GameCube, by shape only (no names or marks). About 2.6 times life size, like the sets.
const port = (g, x, y, z, w, h) => { const p = new THREE.Mesh(new RoundedBoxGeometry(w, h, 0.01, 2, h * 0.25), slotMat); p.position.set(x, y, z); g.add(p); };
const shell = (c, r = 0.4) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
const glows = [];
function xbox(w, h, d) {
  const g = new THREE.Group(), front = d / 2;
  g.add(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, 0.03), shell(0x121212, 0.35)));
  // the jewel: a dark green dome with a glowing ring, pulsing slowly
  const jewel = new THREE.Mesh(new THREE.SphereGeometry(h * 0.3, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x0c2416, roughness: 0.15, metalness: 0.2 }));
  jewel.rotation.x = Math.PI / 2; jewel.scale.z = 0.35; jewel.position.set(0, h * 0.02, front); g.add(jewel);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(h * 0.31, h * 0.025, 8, 40), new THREE.MeshBasicMaterial({ color: GREEN.clone(), toneMapped: false }));
  ring.position.set(0, h * 0.02, front + 0.004); g.add(ring);
  glows.push({ m: ring.material, c: GREEN, rate: 0.35 });
  const tray = new THREE.Mesh(new THREE.BoxGeometry(w * 0.34, h * 0.05, 0.006), slotMat);
  tray.position.set(-w * 0.27, h * 0.28, front + 0.002); g.add(tray);
  for (const x of [-0.4, -0.29, 0.29, 0.4]) port(g, w * x, -h * 0.3, front + 0.002, w * 0.07, h * 0.16);
  button(g, w * 0.36, h * 0.2, front, h * 0.12, h * 0.05, shell(0x1a1a1a), true);
  led(g, w * 0.36, h * 0.2, front + h * 0.06, h * 0.035, pick(otherLeds.slice(0, 1)));
  button(g, w * 0.25, h * 0.2, front, h * 0.1, h * 0.05, shell(0x1a1a1a), true);
  return { g };
}
function playstation(w, h, d) {
  const g = new THREE.Group(), front = d / 2, top = h / 2;
  const grey = shell(0xb8b8b8, 0.5);
  g.add(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, 0.018), grey));
  // the round disc lid and the open, reset and power buttons on top
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(d * 0.36, d * 0.36, 0.008, 48), shell(0xa9a9a9, 0.45));
  lid.position.set(-w * 0.12, top + 0.002, -d * 0.02); g.add(lid);
  const topButton = (x, z, r) => { const b = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.012, 24), shell(0x9d9d9d, 0.4)); b.position.set(x, top + 0.006, z); g.add(b); };
  topButton(w * 0.32, -d * 0.05, d * 0.07); topButton(w * 0.24, d * 0.25, d * 0.035); topButton(w * 0.4, d * 0.25, d * 0.035);
  led(g, w * 0.32, top + 0.006, d * 0.3, 0.008, otherLeds[0]);
  // two controller ports with the memory card slots above them
  for (const x of [-0.18, 0.18]) { port(g, w * x, -h * 0.18, front + 0.002, w * 0.13, h * 0.24); port(g, w * x, h * 0.22, front + 0.002, w * 0.11, h * 0.09); }
  return { g };
}
function nes(w, h, d) {
  const g = new THREE.Group(), front = d / 2;
  g.add(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, 0.012), shell(0xc2c2c2, 0.55)));
  // the dark band along the bottom: the red light, power and reset, two controller ports
  const band = new THREE.Mesh(new THREE.BoxGeometry(w * 0.985, h * 0.38, 0.01), shell(0x3d3d3d, 0.6));
  band.position.set(0, -h * 0.28, front); g.add(band);
  led(g, -w * 0.45, -h * 0.28, front + 0.008, h * 0.04, redLeds[0]);
  button(g, -w * 0.36, -h * 0.28, front + 0.004, w * 0.07, h * 0.12, shell(0xd6d6d6));
  button(g, -w * 0.26, -h * 0.28, front + 0.004, w * 0.07, h * 0.12, shell(0xd6d6d6));
  port(g, -w * 0.02, -h * 0.28, front + 0.007, w * 0.08, h * 0.2); port(g, w * 0.1, -h * 0.28, front + 0.007, w * 0.08, h * 0.2);
  // the cartridge door, with its ridges
  const flap = new THREE.Mesh(new THREE.BoxGeometry(w * 0.62, h * 0.34, 0.01), shell(0xcfcfcf, 0.5));
  flap.position.set(-w * 0.06, h * 0.16, front); g.add(flap);
  for (let i = 0; i < 5; i++) { const r = new THREE.Mesh(new THREE.BoxGeometry(w * 0.58, h * 0.012, 0.004), shell(0xa0a0a0)); r.position.set(-w * 0.06, h * 0.06 + i * h * 0.05, front + 0.006); g.add(r); }
  return { g };
}
function n64(w, h, d) {
  const g = new THREE.Group(), front = d / 2, top = h / 2;
  const body = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, h * 0.35), shell(0x2a2a2a, 0.4));
  g.add(body);
  for (let i = 0; i < 4; i++) port(g, -w * 0.3 + i * w * 0.2, -h * 0.12, front - h * 0.02, w * 0.11, h * 0.28);
  // a cartridge sticking out of the slot on top
  const cart = new THREE.Mesh(new RoundedBoxGeometry(w * 0.26, h * 0.9, d * 0.12, 2, 0.01), shell(0x8a8a8a, 0.5));
  cart.position.set(0, top + h * 0.3, -d * 0.04); g.add(cart);
  const label = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.2, h * 0.5), new THREE.MeshStandardMaterial({ color: 0xd72f21, roughness: 0.6 }));
  label.position.set(0, top + h * 0.36, -d * 0.04 + d * 0.061); g.add(label);
  led(g, -w * 0.42, h * 0.12, front - h * 0.05, h * 0.04, pick(redLeds));
  return { g, extra: h * 0.75 };
}
function gamecube(w, h, d) {
  const g = new THREE.Group(), front = d / 2, top = h / 2;
  g.add(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, 0.025), shell(0x232323, 0.35)));
  for (let i = 0; i < 4; i++) port(g, -w * 0.33 + i * w * 0.22, -h * 0.28, front + 0.002, w * 0.13, h * 0.16);
  port(g, -w * 0.2, h * 0.08, front + 0.002, w * 0.25, h * 0.06); port(g, w * 0.2, h * 0.08, front + 0.002, w * 0.25, h * 0.06);
  // the handle at the back and the round lid
  const handle = new THREE.Mesh(new THREE.TorusGeometry(w * 0.3, 0.012, 8, 24, Math.PI), shell(0x2e2e2e, 0.4));
  handle.position.set(0, top, -d * 0.42); g.add(handle);
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(w * 0.36, w * 0.36, 0.008, 40), shell(0x1b1b1b, 0.3));
  lid.position.set(0, top + 0.002, d * 0.02); g.add(lid);
  led(g, w * 0.4, h * 0.3, front + 0.004, h * 0.03, otherLeds[0]);
  return { g, extra: w * 0.3 };
}

// ---------- the pile ----------
// Skyline packing: sets go in left to right, row after row; each one rests on whatever is highest
// under its footprint, so rows settle unevenly the way a real stack does.
const pile = new THREE.Group();
scene.add(pile);
const W = P.pile.width, BINS = 144, sky = new Float32Array(BINS);
const KINDS = [
  { w: [0.62, 0.78], ar: [0.74, 0.82], d: 0.55, panel: ["right", "under", null] },   // portables
  { w: [0.85, 1.05], ar: [0.72, 0.8], d: 0.7, panel: ["right", "under"] },           // living-room sets
  { w: [1.15, 1.35], ar: [0.68, 0.76], d: 0.85, panel: ["right", "under"] },         // big consoles
  { w: [0.45, 0.55], ar: [0.82, 0.92], d: 0.45, panel: [null, "under"] },            // small monitors
];
const HARDWARE = [
  { w: [0.8, 0.95], ar: [0.2, 0.25], d: 0.5, make: vcr },
  { w: [0.6, 0.85], ar: [0.3, 0.45], d: 0.5, make: rig },
];
// each console goes in once, in among the sets
const CONSOLES = [
  { w: [0.8, 0.84], ar: [0.3, 0.32], d: 0.66, make: xbox },
  { w: [0.7, 0.72], ar: [0.21, 0.23], d: 0.5, make: playstation },
  { w: [0.66, 0.68], ar: [0.3, 0.32], d: 0.53, make: nes },
  { w: [0.68, 0.7], ar: [0.28, 0.3], d: 0.5, make: n64 },
  { w: [0.4, 0.42], ar: [0.72, 0.76], d: 0.42, make: gamecube },
];
const ALL_CONSOLES = [...CONSOLES];
// a console picked but not placed goes back in the queue
const giveBack = (kind) => { if (ALL_CONSOLES.includes(kind) && !CONSOLES.includes(kind)) CONSOLES.push(kind); };
const range = ([a, b]) => a + (b - a) * rand();
let row = 0;
while (row < 5) {
  let x = -W / 2 + (row % 2 ? 0.25 : 0) * rand();
  while (x < W / 2 - 0.4) {
    // bigger sets low in the pile, smaller ones higher up
    const kind = row > 0 && CONSOLES.length && rand() < 0.3 ? CONSOLES.splice(Math.floor(rand() * CONSOLES.length), 1)[0]
      : rand() < (row < 1 ? 0.15 : 0.25) ? pick(HARDWARE)
      : row < 1 ? pick([KINDS[1], KINDS[2], KINDS[2]]) : row < 3 ? pick(KINDS.slice(0, 3)) : pick([KINDS[0], KINDS[3], KINDS[0]]);
    const w = range(kind.w), h = w * range(kind.ar), d = kind.d * (0.9 + 0.2 * rand());
    if (x + w > W / 2 + 0.2) { giveBack(kind); break; }
    // a set rests on whatever is under the middle of its base; its sides can overhang a little
    const bin = (v) => (v + W / 2) / W * BINS;
    const b0 = Math.max(0, Math.ceil(bin(x + w * 0.12))), b1 = Math.min(BINS, Math.floor(bin(x + w * 0.88)));
    let base = 0;
    for (let i = b0; i < b1; i++) base = Math.max(base, sky[i]);
    // keep the top of the pile from getting too tall at the edges: a gentle mound
    const centre = 1 - Math.abs((x + w / 2) / (W / 2));
    if (base > 1.1 + 2.0 * Math.sqrt(Math.max(centre, 0))) { giveBack(kind); x += w; continue; }
    const set = kind.make ? kind.make(w, h, d) : television(w, h, d, pick(kind.panel));
    // TVs sit at their own depth; flat boxes come forward so their fronts line up with the sets'
    const z = (rand() - 0.5) * 0.18 - row * 0.05 + (kind.make ? 0.36 - d / 2 : 0);
    set.g.position.set(x + w / 2, base + h / 2, z);
    set.g.rotation.y = (rand() - 0.5) * (kind.make ? 0.08 : 0.14);
    set.g.rotation.z = (rand() - 0.5) * 0.012;
    pile.add(set.g);
    // anything sticking up (a cartridge, a handle) keeps the next thing off it
    for (let i = Math.max(0, Math.floor(bin(x))); i < Math.min(BINS, Math.ceil(bin(x + w))); i++) sky[i] = Math.max(sky[i], base + h + (set.extra ?? 0));
    x += w + 0.02 + rand() * 0.04;
  }
  row++;
}

// what each set shows: mostly our work, a few with static, bars or switched off
const order = [];
sets.forEach((s, i) => {
  const r = rand();
  if (r < 0.03) { s.uniforms.mode.value = 1; s.channel?.draw("--"); }              // static
  else if (r < 0.07) { s.uniforms.mode.value = 2; s.channel?.draw("00"); }          // colour bars
  else if (r < 0.1) { s.uniforms.power.value = 0.06; s.channel?.draw("  "); s.power.material = standby; } // standby
  else order.push(s);
});
// a different clip on every set to start with, shuffled
const deck = videos.map((_, i) => i).sort(() => rand() - 0.5);
order.forEach((s, i) => tune(s, deck[i % deck.length]));
function tune(s, clip) {
  if (s.clip >= 0 && --users[s.clip] === 0) videos[s.clip].v.pause();
  if (users[clip]++ === 0) play(videos[clip]);
  s.clip = clip;
  s.uniforms.map.value = videos[clip].tex;
  s.uniforms.hasMap.value = 1;
  s.channel?.draw(pad(clip + 1));
}

// ---------- room ----------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.6 }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.MeshStandardMaterial({ color: 0x0d0d0d, roughness: 0.95 }));
wall.position.set(0, 10, -2.2);
scene.add(wall);
scene.add(new THREE.HemisphereLight(0xb0b0b0, 0x000000, 0.4));
// a soft fill from where the viewer stands, so the cases read as cases
const fill = new THREE.DirectionalLight(0xffffff, 0.35);
fill.position.set(0, 2.5, 8);
scene.add(fill);
// a faint light from above so the tops of the cases read against the dark
const top = new THREE.SpotLight(0xffffff, 14, 16, 0.85, 0.9, 1.2);
top.position.set(0, 7, 3); top.target.position.set(0, 1.5, 0);
scene.add(top, top.target);

// the screens' light: three area lights just in front of the pile, left, centre and right
const lights = [-1, 0, 1].map((k) => {
  const l = new THREE.RectAreaLight(0xffffff, P.light, W / 3, 2.6);
  l.position.set(k * W / 3, 1.3, 0.75);
  l.lookAt(k * W / 3, 0.3, 4);
  scene.add(l);
  return { l, x: k * W / 3, colour: new THREE.Color() };
});
function relight() {
  for (const L of lights) {
    L.colour.setRGB(0, 0, 0);
    let n = 0;
    for (const s of sets) {
      if (s.clip < 0 || Math.abs(s.g.position.x - L.x) > W / 3) continue;
      L.colour.add(videos[s.clip].colour); n++;
    }
    if (n) L.colour.multiplyScalar(1 / n);
    // keep some light even when the clips are dark, and lift the saturation a little
    L.l.color.copy(L.colour).lerp(new THREE.Color(0.55, 0.58, 0.62), 0.25);
  }
}

// ---------- post ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), P.bloom.strength, P.bloom.radius, P.bloom.threshold);
composer.addPass(bloom);
const film = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, t: { value: 0 }, res: { value: new THREE.Vector2() } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float t; uniform vec2 res; varying vec2 vUv;
    float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      vec2 d = vUv - .5; d.x *= res.x / res.y;
      c *= 1. - smoothstep(.5, 1.2, length(d)) * .8;
      c += (h21(vUv * res + fract(t * 7.3) * 91.) - .5) * .04;
      gl_FragColor = vec4(c, 1.);
    }`,
});
composer.addPass(film);
composer.addPass(new OutputPass());

// fit the pile's width at the far end of the move, on any screen shape
const view = { dist: P.cam.dist };
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const tanW = Math.tan(P.cam.fov * Math.PI / 360) * camera.aspect;
  const fit = (W * 0.5 + 0.3) / tanW;
  // on a phone the whole pile would be tiny: frame its middle half
  view.dist = Math.max(P.cam.dist, fit * (camera.aspect < 1 ? 0.5 : 0.92));
  film.uniforms.res.value.set(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
}
addEventListener("resize", resize);
resize();

// ---------- motion ----------
const pointer = new THREE.Vector2(), drift = new THREE.Vector2();
addEventListener("pointermove", (e) => pointer.set(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1));
const t0 = performance.now();
let frameNo = 0, progress = 0, playing = FIXED_T === null, nextChannel = 1.5;

function frame() {
  if (window.__paused && FIXED_T === null) {
    if (playing) { videos.forEach((c) => c.v.pause()); playing = false; }
    requestAnimationFrame(frame);
    return;
  }
  if (!playing && FIXED_T === null) { videos.forEach((c, i) => users[i] && c.v.play().catch(() => {})); playing = true; }
  const t = FIXED_T ?? (performance.now() - t0) / 1000;

  // every couple of seconds one set changes channel: a burst of static, then the next clip
  if (FIXED_T === null && t > nextChannel && order.length) {
    const s = order[Math.floor(Math.random() * order.length)];
    s.switchAt = t;
    nextChannel = t + 1.2 + Math.random() * 1.8;
  }
  for (const s of sets) {
    s.uniforms.t.value = t;
    if (s.switchAt >= 0) {
      const k = t - s.switchAt;
      if (k > 0.18 && s.uniforms.noise.value > 0.5 && s.pending !== false) {
        // the next channel is a clip no other set is showing, when there is one
        const free = users.map((n, i) => (n === 0 ? i : -1)).filter((i) => i >= 0);
        tune(s, free.length ? free[Math.floor(Math.random() * free.length)] : (s.clip + 1) % videos.length);
        s.pending = false;
      }
      s.uniforms.noise.value = k < 0.18 ? 1 : Math.max(0, 1 - (k - 0.18) / 0.25);
      if (k > 0.45) { s.switchAt = -1; s.uniforms.noise.value = 0; s.pending = true; }
    }
  }
  for (const s of sets) if (s.clip >= 0) s.uniforms.clipAspect.value = videos[s.clip].aspect;
  if (frameNo++ % 6 === 0) { videos.forEach(sampleClip); relight(); }
  // the lights blink, the VCRs flash 12:00 and the test gear counts
  blink(t);
  for (const l of glows) l.m.color.copy(l.c).multiplyScalar(0.6 + 0.9 * (0.5 + 0.5 * Math.sin(t * l.rate * 6.283)));
  for (const c of clocks) c.clock.mat.color.setScalar((t + c.phase) % 1 < 0.5 ? 1.8 : 0.04);
  for (const c of counters) if (t > c.next) { c.n = (c.n + 1 + Math.floor(Math.random() * 7)) % 1000; c.counter.draw(String(c.n).padStart(3, "0")); c.next = t + c.rate; }

  // camera: slides with the cursor and always looks straight at the pile. While the next section
  // scrolls up over the wall it sinks P.cam.fall metres, still level, so the pile slides up past
  // you and the floor rises fastest (the services room does the same)
  drift.lerp(pointer, 0.04);
  progress += (Math.min(Math.max(window.__scroll ?? 0, 0), 1) - progress) * (FIXED_T === null ? 0.1 : 1);
  const sway = FIXED_T === null ? Math.sin(t * 0.2) * 0.05 : 0;
  camera.position.set(drift.x * P.cam.drift + sway, P.cam.y - drift.y * P.cam.drift * 0.35 - P.cam.fall * progress, view.dist);
  camera.lookAt(camera.position.x, camera.position.y, 0);
  film.uniforms.t.value = t;
  composer.render();
  requestAnimationFrame(frame);
}
frame();
// ready once the first clips can draw, so screenshots don't catch black screens
const ready = () => { const on = videos.filter((_, i) => users[i]); return on.filter((c) => c.v.readyState >= 2).length >= on.length - 2 ? (window.__ready = true) : setTimeout(ready, 100); };
ready();
</script></body></html>
