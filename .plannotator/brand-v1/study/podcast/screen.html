<!doctype html><html><head><meta charset="utf-8"><title>Podcast screen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Podcast player screen for the phone mockup (Rerun 23, reference/rerun/stills/studiogruhl_rerun_23-podcast.jpg).
   440 x 956 CSS px, rendered at 3x into the PSD's 1320 x 2868 smart object.
   Cover: the Blank wordmark on sand across the top, a heat render of Plato under it, the show and
   episode set on the heat. Player chrome below in the system face, the way the OS draws it.
   ?t= freezes the heat (default 1.2) */
*{margin:0;box-sizing:border-box}
html,body{width:440px;height:956px;overflow:hidden;background:#000;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
svg{display:block}
.status{position:absolute;left:0;right:0;top:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 52px}
.status .time{font-size:17px;font-weight:600;letter-spacing:-.01em}
.status .icons{display:flex;gap:6px;align-items:center}
.island{position:absolute;left:50%;top:11px;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000}
.cover{position:absolute;left:28px;right:28px;top:96px;height:384px;border-radius:10px;overflow:hidden;background:#F1EFEB;color:#0E0D0D;font-family:"Inter Tight",sans-serif}
.cover .wm{position:absolute;left:12px;right:12px;top:12px}
.cover .wm svg{width:100%;height:auto;fill:#0E0D0D}
.cover .heat{position:absolute;left:0;right:0;top:106px;bottom:0;overflow:hidden}
.cover .heat iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.cover .show{position:absolute;left:14px;top:114px;font-size:30px;line-height:1;letter-spacing:-.035em;font-weight:400}
.cover .ep{position:absolute;left:14px;right:190px;bottom:14px}
.cover .host{font-size:11px;letter-spacing:-.005em;margin-bottom:5px}
.cover .title{font-size:20px;line-height:1.05;letter-spacing:-.03em}
.meta{position:absolute;left:28px;right:28px;top:512px}
.meta h2{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.meta p{font-size:19px;color:rgba(255,255,255,.55);margin-top:3px}
.scrub{position:absolute;left:28px;right:28px;top:600px}
.track{height:7px;border-radius:4px;background:rgba(255,255,255,.28);overflow:hidden}
.track i{display:block;height:100%;width:25.5%;background:rgba(255,255,255,.85);border-radius:4px}
.times{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;font-weight:500;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
.controls{position:absolute;left:28px;right:28px;top:680px;display:flex;justify-content:space-around;align-items:center}
.vol{position:absolute;left:28px;right:28px;top:806px;display:flex;align-items:center;gap:12px}
.vol .track{flex:1;height:6px}.vol .track i{width:62%}
.home{position:absolute;left:50%;bottom:8px;width:146px;height:5px;margin-left:-73px;border-radius:3px;background:#fff}
</style></head><body>
<div class="status"><span class="time">9:41</span>
  <span class="icons">
    <svg width="19" height="12" viewBox="0 0 19 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1.2-1.2C13.8 1.6 11.3.6 8.5.6S3.2 1.6 1.3 3.5l1.2 1.2c1.6-1.5 3.7-2.4 6-2.4z"/><path d="M8.5 5.6c1.4 0 2.7.5 3.7 1.4l1.2-1.2C12.1 4.6 10.4 3.9 8.5 3.9S4.9 4.6 3.6 5.8L4.8 7c1-.9 2.3-1.4 3.7-1.4z"/><path d="M8.5 8.9c.6 0 1.1.2 1.5.6L8.5 11 7 9.5c.4-.4.9-.6 1.5-.6z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="rgba(255,255,255,.4)"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#fff"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="rgba(255,255,255,.4)"/></svg>
  </span></div>
<div class="island"></div>

<div class="cover">
  <div class="heat"></div>
  <div class="wm"></div>
  <p class="show">Infinite Software</p>
  <div class="ep"><p class="host">Hosted by Aryan</p><p class="title">What a website looks like to the agent reading it.</p></div>
</div>

<div class="meta"><h2>What a website looks like to the agent reading it</h2><p>Infinite Software</p></div>
<div class="scrub"><div class="track"><i></i></div><div class="times"><span>7:32</span><span>-22:01</span></div></div>
<div class="controls">
  <svg width="44" height="44" viewBox="0 0 44 44" fill="#fff"><path d="M22 8a14 14 0 1 1-13.4 10h3.2A11 11 0 1 0 22 11v4.5L15.5 9.5 22 3.5z"/><text x="22" y="29" font-size="11" font-weight="700" text-anchor="middle" font-family="-apple-system,system-ui">15</text></svg>
  <svg width="54" height="58" viewBox="0 0 54 58" fill="#fff"><rect x="8" y="6" width="13" height="46" rx="3"/><rect x="33" y="6" width="13" height="46" rx="3"/></svg>
  <svg width="44" height="44" viewBox="0 0 44 44" fill="#fff"><path d="M22 8a14 14 0 1 0 13.4 10h-3.2A11 11 0 1 1 22 11v4.5l6.5-6L22 3.5z"/><text x="22" y="29" font-size="11" font-weight="700" text-anchor="middle" font-family="-apple-system,system-ui">30</text></svg>
</div>
<div class="vol">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="rgba(255,255,255,.55)"><path d="M2 6h3l4-3.5v11L5 10H2z"/></svg>
  <div class="track"><i></i></div>
  <svg width="22" height="16" viewBox="0 0 22 16" fill="rgba(255,255,255,.55)"><path d="M2 6h3l4-3.5v11L5 10H2z"/><path d="M12 4.5a5 5 0 0 1 0 7l-1-1a3.6 3.6 0 0 0 0-5zM15 2a8.5 8.5 0 0 1 0 12l-1-1a7 7 0 0 0 0-10z"/></svg>
</div>
<div class="home"></div>

<script src="../../mark/rand.js"></script><script>
const q = new URLSearchParams(location.search), t = q.get("t") ?? "1.2";
document.querySelector(".wm").innerHTML = `<svg viewBox="0 0 ${RAND.B.width} ${RAND.B.height}" fill-rule="evenodd"><path d="${RAND.B.path}"/></svg>`;
const f = document.createElement("iframe");
f.src = `../../posters/heat?s=plato&t=${t}&dist=${q.get("dist") ?? 12}&lookX=${q.get("lookX") ?? -1.75}&lookY=${q.get("lookY") ?? 0.6}`;
document.querySelector(".cover .heat").appendChild(f);
const wait = setInterval(() => { try { if (f.contentWindow.__ready) { clearInterval(wait); document.fonts.ready.then(() => setTimeout(() => (document.title = "ready"), 800)); } } catch {} }, 150);
</script></body></html>
