<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}html,body{width:1280px;height:800px;background:#9BBFD3;overflow:hidden}
canvas{display:block;width:1280px;height:800px}
</style></head><body><canvas id="c"></canvas><script>
// blank interfaces artwork generator, after the mechanism of Rerun's artwork visualizer:
// a media source, blurred, displaced by low-octave noise plus a radial wave, mapped through a
// cyclic gradient (stop 4 = stop 0). Empty space renders as the calm background gradient.
// The machine: blank ground -> a page heats up out of it -> cools to blank -> next page.
const STOPS = ["#186ADD", "#9BBFD3", "#86D9A6", "#F6DA75", "#D72F21", "#186ADD"];
const BG = ["#186ADD", "#9BBFD3"];
const PAGES = ["https://doop.design/a/Ax7cISPdot.jpg","https://doop.design/a/1HoAU0R8SQ.jpg","https://doop.design/a/ppvIUIaKGt.jpg","https://doop.design/a/0O3GYesWZz.jpg","https://doop.design/a/hyA9sn8Ppn.jpg"];
const W = 1280, H = 800, LW = 320, LH = 200;

const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function lut(stops) {
  const c = stops.map(rgb), out = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) {
    const u = (i / 255) * (c.length - 1), k = Math.min(c.length - 2, Math.floor(u)), f = u - k;
    for (let j = 0; j < 3; j++) out[i * 3 + j] = c[k][j] * (1 - f) + c[k + 1][j] * f;
  }
  return out;
}
const CYC = lut(STOPS), BGL = lut(BG);

const perm = (() => { const p = new Uint8Array(256).map((_, i) => i); let s = 7;
  for (let i = 255; i > 0; i--) { s = (s * 16807) % 2147483647; const j = s % (i + 1); [p[i], p[j]] = [p[j], p[i]]; }
  return new Uint8Array(512).map((_, i) => p[i & 255]); })();
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), X = xi & 255, Y = yi & 255;
  const a = perm[perm[X] + Y] / 255, b = perm[perm[X + 1] + Y] / 255, c = perm[perm[X] + Y + 1] / 255, d = perm[perm[X + 1] + Y + 1] / 255;
  return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 2 - 1;
}
const fbm = (x, y, o = 2) => { let s = 0, a = 0.5; for (let i = 0; i < o; i++) { s += a * noise(x, y); x = x * 2.03 + 17.1; y = y * 2.03 + 9.2; a *= 0.5; } return s; };

// per page at low res: blurred luminance L and a detail map D (where the content is)
function analyse(img) {
  const cv = document.createElement("canvas"); cv.width = LW; cv.height = LH;
  const g = cv.getContext("2d", { willReadFrequently: true });
  const read = (blur) => { g.filter = `blur(${blur}px) grayscale(1)`; const p = blur * 3; g.clearRect(0, 0, LW, LH); g.drawImage(img, -p, -p, LW + 2 * p, LH + 2 * p);
    const d = g.getImageData(0, 0, LW, LH).data, o = new Float32Array(LW * LH); for (let i = 0; i < o.length; i++) o[i] = d[i * 4] / 255; return o; };
  const L = read(1.2), Lb = read(6);
  const raw = new Float32Array(LW * LH); for (let i = 0; i < raw.length; i++) raw[i] = Math.abs(L[i] - Lb[i]) + 0.25 * (1 - Lb[i]);
  // blur the detail map so the content reads as warm regions, not edges
  const t = document.createElement("canvas"); t.width = LW; t.height = LH; const tg = t.getContext("2d", { willReadFrequently: true });
  const id = tg.createImageData(LW, LH); let mx = 0; for (const v of raw) mx = Math.max(mx, v);
  for (let i = 0; i < raw.length; i++) { const v = (raw[i] / mx) * 255; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; }
  tg.putImageData(id, 0, 0); g.filter = "blur(10px)"; g.clearRect(0, 0, LW, LH); g.drawImage(t, -30, -30, LW + 60, LH + 60);
  const dd = g.getImageData(0, 0, LW, LH).data, D = new Float32Array(LW * LH); for (let i = 0; i < D.length; i++) D[i] = dd[i * 4] / 255;
  // per-page threshold so heat covers ~48% of the frame whatever the page density
  const sorted = Float32Array.from(D).sort(), lo = sorted[Math.floor(sorted.length * 0.36)], hi = sorted[Math.floor(sorted.length * 0.6)];
  return { L: read(1.6), D, lo, hi: Math.max(hi, lo + 0.02) };
}

const c = document.getElementById("c"), dpr = 1.5; c.width = W * dpr; c.height = H * dpr;
const g = c.getContext("2d"); g.scale(dpr, dpr); g.imageSmoothingQuality = "high";
const low = document.createElement("canvas"); low.width = LW; low.height = LH; const lg = low.getContext("2d"); const out = lg.createImageData(LW, LH);
const grain = document.createElement("canvas"); grain.width = W; grain.height = H;
{ const gx = grain.getContext("2d"), gi = gx.createImageData(W, H); for (let i = 0; i < gi.data.length; i += 4) { const n = Math.random() * 255; gi.data[i] = gi.data[i + 1] = gi.data[i + 2] = n; gi.data[i + 3] = 30; } gx.putImageData(gi, 0, 0); }

const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const T = 7.5; // per page: 0-2.6 heat up, 2.6-4.6 hold, 4.6-7.0 cool, 7.0-7.5 blank
const presence = (u) => (u < 2.6 ? ease(u / 2.6) : u < 4.6 ? 1 : u < 7 ? 1 - ease((u - 4.6) / 2.4) : 0);
let pages = [];

function draw(t) {
  const cyc = Math.floor(t / T), u = t - cyc * T, pr = presence(u), P = pages[cyc % pages.length];
  const d = out.data, asp = LW / LH;
  for (let j = 0; j < LH; j++) for (let i = 0; i < LW; i++) {
    const x = i / LW, y = j / LH, k = j * LW + i;
    // noise displacement (scale 3, octaves 2, amount 0.5) and a radial wave from off-canvas upper right
    const nx = fbm(x * 3 * asp + t * 0.05, y * 3), ny = fbm(x * 3 * asp + 5.2, y * 3 - t * 0.05);
    const si = Math.max(0, Math.min(LW - 1, Math.round(i + nx * 14))), sj = Math.max(0, Math.min(LH - 1, Math.round(j + ny * 14)));
    const q = sj * LW + si;
    const r = Math.hypot((x - 1.5) * asp * 0.5, (y + 0.5)), wave = r / 0.9 - t * 0.05;
    const m = P ? smooth(P.lo, P.hi, P.D[q]) * pr : 0;
    const v = wave + 2.4 * (P ? 1 - P.L[q] : 0) + 0.1 * nx;
    const ci = Math.round((((v % 1) + 1) % 1) * 255) * 3;
    const bv = Math.round(Math.max(0, Math.min(1, 0.5 + 0.42 * fbm(x * 1.1 * asp + t * 0.02, y * 1.1) + 0.16 * (1 - y))) * 255) * 3;
    for (let ch = 0; ch < 3; ch++) d[k * 4 + ch] = BGL[bv + ch] * (1 - m) + CYC[ci + ch] * m;
    d[k * 4 + 3] = 255;
  }
  lg.putImageData(out, 0, 0);
  g.drawImage(low, 0, 0, W, H);
  g.globalCompositeOperation = "soft-light"; g.drawImage(grain, 0, 0); g.globalCompositeOperation = "source-over";
}

const imgs = PAGES.map((s) => { const i = new Image(); i.crossOrigin = "anonymous"; i.src = s; return i; });
const q = new URLSearchParams(location.search), still = matchMedia("(prefers-reduced-motion: reduce)").matches;
Promise.all(imgs.map((i) => i.decode())).then(() => {
  pages = imgs.map(analyse);
  if (q.has("t")) { draw(+q.get("t")); document.title = "ready"; return; }
  const t0 = performance.now() - 3000;
  const loop = () => { draw((performance.now() - t0) / 1000); if (!still) requestAnimationFrame(loop); };
  loop();
});
</script></body></html>
