<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dune scan</title>
<!--
  The depth scan (scan.py) on a 3D scene instead of estimated depth: a lone hooded figure on the
  crest of a dune field, slow motion. Depth is exact, so edges are as sharp as the render.
  Every surface is coloured in its own fragment shader from its distance to the camera, so the
  canvas's antialiasing applies to the silhouettes. Scene and figure are procedural and original.

  Band: same raised cosine as scan.py (noir to the Rerun red, period P.period, clipped floor),
  depth remapped with a log so near sand, the figure and the far dunes each get a share of it.

  URL: ?t=<seconds> freezes time, ?period= ?k= ?near= ?far= the band, ?c=sand|blue|mint the colour,
  ?ang= ?dist= ?up= ?look= ?fov= the camera, ?turn= the figure. window.renderAt(t) draws one frame
  (capture.sh uses it).
-->
<style>
  html, body { margin: 0; height: 100%; background: #0e0d0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<script>addEventListener("error", (e) => (document.title = "ERR " + e.message));</script>
<script type="module">
import * as THREE from "three";

const qs = new URLSearchParams(location.search);
const FIXED_T = qs.has("t") ? parseFloat(qs.get("t")) : null;
const P = {
  period: qs.has("period") ? parseFloat(qs.get("period")) : 3.6,
  k: qs.has("k") ? parseFloat(qs.get("k")) : 1.2, // band cycles across the depth range (scan.py)
  floor: 0.08,    // fraction of the cosine clipped to black (scan.py)
  near: qs.has("near") ? parseFloat(qs.get("near")) : 50, far: qs.has("far") ? parseFloat(qs.get("far")) : 600,
  slow: 0.25,     // slow motion: scene time runs at a quarter of real time
};

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(qs.has("fov") ? parseFloat(qs.get("fov")) : 4, 16 / 9, 0.1, 3000);

// One material for everything: colour from distance to the camera.
const U = { t: { value: 0 }, period: { value: P.period }, k: { value: P.k }, floorV: { value: P.floor },
  nearD: { value: P.near }, farD: { value: P.far }, wind: { value: 0 }, ts: { value: 0 },
  C1: { value: new THREE.Vector3() }, C2: { value: new THREE.Vector3() } };
// colours from the Rerun spectrum (heat ramp): ?c=sand | blue | mint
const SPEC = { blue: [.094, .416, .867], pale: [.608, .749, .827], mint: [.525, .851, .651], sand: [.965, .855, .459], red: [.843, .184, .129] };
const RAMPS = { sand: ["sand", "sand"], blue: ["blue", "blue"], mint: ["blue", "mint"], red: ["red", "red"] };
const [c1, c2] = RAMPS[qs.get("c") || "sand"];
U.C1.value.set(...SPEC[c1]); U.C2.value.set(...SPEC[c2]);
const scanFrag = /* glsl */`
  uniform float t, period, k, floorV, nearD, farD;
  uniform vec3 C1, C2;   // ramp: noir -> C1 -> C2 (C2 = C1 for one colour)
  vec3 NOIR = vec3(14., 13., 13.) / 255.;
  vec3 scan(float dist) {
    // log remap: 0 = far, 1 = near (scan.py's equalised depth runs the same way)
    float d = 1. - clamp(log(dist / nearD) / log(farD / nearD), 0., 1.);
    float v = .5 + .5 * cos(6.2831853 * (t / period - k * d));
    v = clamp((v - floorV) / (1. - floorV), 0., 1.);
    v = v * v * (3. - 2. * v);
    vec3 c = v < .7 ? mix(NOIR, C1, v / .7) : mix(C1, C2, (v - .7) / .3);
    return mix(c, NOIR, smoothstep(farD * .7, farD, dist));   // returns fade out at the far limit
  }`;
function scanMaterial(vertexBody = "") {
  return new THREE.ShaderMaterial({
    uniforms: U, side: THREE.DoubleSide,
    vertexShader: /* glsl */`
      uniform float t, ts, wind; varying vec3 vW;
      void main() {
        vec3 p = position; ${vertexBody}
        vec4 w = modelMatrix * vec4(p, 1.); vW = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: scanFrag + /* glsl */`
      varying vec3 vW;
      void main() { gl_FragColor = vec4(scan(distance(cameraPosition, vW)), 1.); }`,
  });
}

// no sky: like a real scanner, where there is no surface there is no return, so the sky is noir
renderer.setClearColor(0x0e0d0d, 1);

// ---------- dunes (posters/heat.html dunes(), scaled up and widened to the horizon) ----------
const hash = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };
const vnoise = (x, z) => {
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
};
// height in world units at (x, z): wind ridges as in heat.html, 10x the scale
function height(x, z) {
  const X = x / 10, Z = z / 10;
  const bend = 0.9 * (vnoise(X * 0.35, Z * 0.35) - 0.5);
  const a = 2 * Math.PI * (Z * 0.55 + bend + 0.15 * Math.sin(X * 0.7));
  const ridge = 0.5 + 0.5 * Math.sin(a + 0.75 * Math.sin(a));
  const amp = 0.55 + 0.45 * vnoise(X * 0.5 + 9, Z * 0.3);
  const field = (amp * Math.pow(ridge, 1.6) * 1.7) * 6 + 4 * (vnoise(X * 0.15, Z * 0.15) - 0.5);
  // the hero dune at the origin: a long crest along x, gentle windward slope (z < 0), steep lee (z > 0)
  const along = Math.exp(-Math.pow(x / 70, 2));
  const crestLine = 6 * Math.sin(x / 35);                  // the crest bends a little
  const zz = z - crestLine;
  const across = zz < 0 ? Math.exp(-Math.pow(zz / 38, 2)) : Math.exp(-Math.pow(zz / 13, 2));
  const hero = 26 * along * across;
  return Math.max(field, hero + field * 0.25);
}
const geo = new THREE.PlaneGeometry(1400, 1400, 1100, 1100);
geo.rotateX(-Math.PI / 2);
const pos = geo.attributes.position;
for (let i = 0; i < pos.count; i++) pos.setY(i, height(pos.getX(i), pos.getZ(i)));
scene.add(new THREE.Mesh(geo, scanMaterial()));

// find a crest near the origin along z: the figure stands on it
let crestZ = 0, best = -1e9;
for (let z = -20; z <= 20; z += 0.05) { const h = height(0, z); if (h > best) { best = h; crestZ = z; } }
const crest = new THREE.Vector3(0, height(0, crestZ), crestZ);

// ---------- the figure: an original lone wanderer, hooded robe and a long cloak in the wind ----------
// Generic on purpose: a hood, a robe, a cloak. No costume from any film.
const fig = new THREE.Group();
// robe: a lathe; flared hem, narrow waist, broad shoulders, sloping into the neck under the hood
const prof = [[0.0, 0], [0.36, 0], [0.35, 0.12], [0.27, 0.6], [0.21, 1.0], [0.25, 1.25], [0.27, 1.36], [0.2, 1.46], [0.08, 1.52], [0.0, 1.53]]
  .map(([r, y]) => new THREE.Vector2(r, y));
const robe = new THREE.LatheGeometry(prof, 96);
const rp = robe.attributes.position;
for (let i = 0; i < rp.count; i++) {
  const x = rp.getX(i), y = rp.getY(i), z = rp.getZ(i);
  rp.setX(i, x * (1 + 0.45 * Math.max(0, y - 1.0)));   // shoulders wider than deep
  rp.setZ(i, z * 0.78);
}
robe.computeVertexNormals();
fig.add(new THREE.Mesh(robe, scanMaterial(`
  float hem = 1. - smoothstep(0., .7, p.y);
  p.x += hem * (.04 * sin(ts * 5.3 + p.z * 9.) + .07 * wind);
  p.z += hem * .025 * sin(ts * 6.1 + p.x * 11.);`)));
// hood: a cowl. A cone-like lathe, open at the bottom over the shoulders, peaked and tipped back
const hprof = [[0.0, 0.4], [0.06, 0.38], [0.12, 0.32], [0.16, 0.22], [0.17, 0.12], [0.19, 0.03], [0.22, -0.05]]
  .map(([r, y]) => new THREE.Vector2(r, y));
const hood = new THREE.LatheGeometry(hprof, 64);
const hp = hood.attributes.position;
for (let i = 0; i < hp.count; i++) {
  const x = hp.getX(i), y = hp.getY(i), z = hp.getZ(i);
  hp.setZ(i, z * 0.95 - 0.12 * Math.max(0, y) * Math.max(0, y) / 0.18);   // the peak falls back
}
hood.computeVertexNormals();
const hoodM = new THREE.Mesh(hood, scanMaterial());
hoodM.position.set(0, 1.42, 0);
fig.add(hoodM);
// cloak: a broad sheet pinned down the back seam, its free edge blown downwind (+x). The lower it
// hangs, the further the wind carries it, so the silhouette is a sail trailing from the shoulders.
// PlaneGeometry x = down the back (0 shoulders .. 1 hem), y = out from the seam (0) to the free edge (1)
const cloak = new THREE.PlaneGeometry(1, 1, 90, 90);
cloak.translate(0.5, 0.5, 0);
const cloakM = new THREE.Mesh(cloak, scanMaterial(`
  float u = p.x, s = p.y;
  vec3 seam = vec3(.0, -u * 1.32, -.19 - .05 * u);
  float reach = (.12 + 1.15 * pow(u, 1.15)) * (1. + .12 * wind);
  float lift = .25 * u + .1 * sin(ts * 2.1 - u * 3.);       // the free edge rides up a little
  vec3 q = seam + s * reach * vec3(cos(lift), sin(lift) * .45, -.15);
  // folds travelling outwards along the cloth, slow motion
  q.z += s * (.1 * sin(ts * 3.7 - s * 7. + u * 4.) + .035 * sin(ts * 6.3 - s * 13. - u * 6.));
  q.y += s * s * .07 * sin(ts * 2.9 - s * 6. + u * 2.5);
  // a frayed free edge and hem
  float n = .5 + .25 * sin(u * 37. + 1.3 * sin(ts * 1.7)) + .25 * sin(u * 91.3 + 2.1) * sin(u * 17.9 - ts);
  float fray = smoothstep(.9, 1., s) * n;
  q.x -= fray * .03; q.y += smoothstep(.94, 1., u) * .015 * sin(s * 11. + ts);
  p = q;`));
cloakM.position.set(0, 1.4, 0);
fig.add(cloakM);
fig.position.copy(crest);
fig.position.y -= 0.05;
fig.rotation.y = qs.has("turn") ? parseFloat(qs.get("turn")) : 2.0;
scene.add(fig);

// ---------- camera: low on the windward slope, looking up at the figure against the sky ----------
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

const CAM = { ang: -1.1, dist: 110, up: 6, look: -0.5, abs: 1 };  // abs: up is measured from the crest
for (const k of Object.keys(CAM)) if (qs.has(k)) CAM[k] = parseFloat(qs.get(k));
const start = performance.now();
let held = FIXED_T;
window.renderAt = (t) => { held = t; draw(t); return true; };
function frame() {
  requestAnimationFrame(frame);
  draw(held ?? (performance.now() - start) / 1000);
}
function draw(t) {
  const s = t * P.slow;                     // slow-motion scene time
  U.t.value = t; U.ts.value = s; U.wind.value = Math.sin(s * 1.3);
  // a slow push in and a slight arc over the clip
  const ang = CAM.ang + 0.04 * s, dist = CAM.dist - 0.2 * s;
  const cx = crest.x + Math.sin(ang) * dist, cz = crest.z + Math.cos(ang) * dist;
  camera.position.set(cx, CAM.abs ? crest.y + CAM.up : height(cx, cz) + CAM.up, cz);
  camera.lookAt(crest.x, crest.y + CAM.look, crest.z);
  renderer.render(scene, camera);
}
frame();
window.__ready = true;
</script>
</body>
</html>
