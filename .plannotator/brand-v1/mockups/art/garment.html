<!doctype html><html><head><meta charset="utf-8">
<title>Garment print</title>
<style>
/* Print art for the apparel mockups (Mockups-Design PSDs). The smart object covers the whole garment
   and is burned onto a white shirt, so this page is the fabric colour plus the print.
   ?w=&h= the smart object's size in px (render at deviceScaleFactor 1)
   ?x=&y=&mw= wordmark left/top and width as fractions of the canvas
   ?heat=<seconds> freezes the heat pass on the print (white ink on the fabric), omit for a plain print
   ?fabric=#hex, default a lifted noir so the folds survive the burn blend */
*{margin:0;box-sizing:border-box}
html,body{overflow:hidden}
.mark{position:absolute}
.mark svg{display:block;width:100%;height:auto;fill:#fff}
</style></head><body>
<div class="mark" id="mark"><svg fill-rule="evenodd" role="img" aria-label="Blank"></svg></div>
<script src="../../mark/rand.js"></script><script src="../../mark/heat-logo.js"></script><script>
const q = new URLSearchParams(location.search), n = (k, d) => parseFloat(q.get(k) ?? d);
const W = n("w", 2000), H = n("h", 2000), fabric = q.get("fabric") ?? "#2B2A2A";
Object.assign(document.documentElement.style, { width: W + "px", height: H + "px", background: fabric });
Object.assign(document.body.style, { width: W + "px", height: H + "px", background: fabric });
const el = document.getElementById("mark"), svg = el.querySelector("svg");
Object.assign(el.style, { left: n("x", .35) * W + "px", top: n("y", .3) * H + "px", width: n("mw", .3) * W + "px" });
svg.setAttribute("viewBox", `0 0 ${RAND.B.width} ${RAND.B.height}`); svg.innerHTML = `<path d="${RAND.B.path}"/>`;
const rgb = [1, 3, 5].map((i) => parseInt(fabric.slice(i, i + 2), 16) / 255);
if (q.has("heat")) attachHeatLogo(el, { ink: [1, 1, 1], bg: rgb, autoplay: true }).setT(n("heat", 2));
requestAnimationFrame(() => requestAnimationFrame(() => document.title = "ready"));
</script></body></html>
