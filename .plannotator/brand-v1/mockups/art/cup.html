<!doctype html><html><head><meta charset="utf-8">
<title>Cup print</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400&display=swap" rel="stylesheet">
<style>
/* Print for the plastic cup (Pixelbuddha 9926, smart object 3209 x 2163, wrapped round the cup with
   a fitted cylinder in scripts/cylinder.py). About 90% of the width shows on the front, so the text
   stays in the middle 60%. The line sits where the mockup's own title sat; the wordmark sits small
   at the foot, like the mockup's spec line. ?bg=#000/#fff for matting (scripts/matte.py). */
*{margin:0;box-sizing:border-box}
html,body{width:3209px;height:2163px;overflow:hidden;font-family:"Inter Tight",sans-serif}
.wrap{position:absolute;left:50%;transform:translateX(-50%);top:170px;width:max-content;color:#0E0D0D}
h1{font-weight:400;font-size:300px;line-height:.9;letter-spacing:-.045em}
.mark{position:absolute;left:50%;transform:translateX(-50%);top:1880px;width:520px}
.mark svg{display:block;width:100%;height:auto;fill:#0E0D0D}
</style></head><body>
<div class="wrap"><h1>Drink the<br>cool aid.</h1></div>
<div class="mark"><svg id="mark" fill-rule="evenodd" role="img" aria-label="Blank"></svg></div>
<script src="../../mark/rand.js"></script><script>
document.body.style.background = new URLSearchParams(location.search).get("bg") ?? "#fff";
const svg = document.getElementById("mark");
svg.setAttribute("viewBox", `0 0 ${RAND.B.width} ${RAND.B.height}`); svg.innerHTML = `<path d="${RAND.B.path}"/>`;
document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(() => document.title = "ready")));
</script></body></html>
