<!doctype html><html><head><meta charset="utf-8">
<title>Iced cup print, unrolled</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400&display=swap" rel="stylesheet">
<style>
/* The cup print as if the sleeve were cut open and laid flat (3200 x 2081, same height as the
   smart object, square pixels at its vertical scale). scripts/wrap_cup.py wraps it round the cup, so the wordmark, wider than the half of
   the cup you can see, runs off round both sides. ?bg=#000/#fff for matting. */
*{margin:0;box-sizing:border-box}
html,body{width:3200px;height:2081px;overflow:hidden;font-family:"Inter Tight",sans-serif;color:#0E0D0D}
.mark{position:absolute;left:50%;transform:translateX(-50%);top:1030px;width:2700px}
.mark svg{display:block;width:100%;height:auto;fill:#0E0D0D}
p{position:absolute;left:50%;transform:translateX(-50%);top:900px;font-size:58px;letter-spacing:-.01em;white-space:nowrap}
</style></head><body>
<p>Drink the cool aid.</p>
<div class="mark"><svg id="mark" fill-rule="evenodd" role="img" aria-label="Blank"></svg></div>
<script src="../../mark/rand.js"></script><script>
document.body.style.background = new URLSearchParams(location.search).get("bg") ?? "#fff";
const svg = document.getElementById("mark");
svg.setAttribute("viewBox", `0 0 ${RAND.B.width} ${RAND.B.height}`); svg.innerHTML = `<path d="${RAND.B.path}"/>`;
document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(() => document.title = "ready")));
</script></body></html>
