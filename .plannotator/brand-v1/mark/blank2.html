<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1600px;background:#171616;padding:60px;display:grid;gap:40px}
.row{border-radius:14px;padding:80px 60px;display:flex;justify-content:center;align-items:flex-end;gap:70px}
.noir{background:#000}.sand{background:#F1EFEB}
svg{display:block}
</style></head><body>
<div class="row sand"><svg data-w="BI" data-h="150" fill="#171616"></svg><svg data-w="Blank" data-h="150" fill="#171616"></svg></div>
<div class="row noir"><svg data-w="Blank" data-h="150" fill="#fff"></svg><svg data-w="BlankSpur" data-h="150" fill="#fff"></svg></div>
<div class="row sand"><svg data-w="blank" data-h="150" fill="#171616"></svg><svg data-w="blankSpur" data-h="150" fill="#171616"></svg></div>
<div class="row noir"><svg data-w="Blank" data-h="56" fill="#fff"></svg><svg data-w="Blank" data-h="24" fill="#fff"></svg><svg data-w="BlankSpur" data-h="56" fill="#fff"></svg><svg data-w="BlankSpur" data-h="24" fill="#fff"></svg></div>
<script src="blank2.js"></script><script>
for (const s of document.querySelectorAll("svg")) { const w = WORD[s.dataset.w], h = +s.dataset.h;
  s.setAttribute("viewBox", `0 0 ${w.width} ${w.height}`); s.style.height = h + "px"; s.style.width = (h * w.width / w.height) + "px";
  s.setAttribute("fill-rule", "evenodd"); s.innerHTML = w.svg; }
document.title = "ready";
</script></body></html>
