<!doctype html><html><head><meta charset="utf-8"><title>Blank band</title><style>
*{margin:0;box-sizing:border-box}
body{width:1600px;background:#171616;padding:50px;display:grid;gap:30px}
.row{border-radius:14px;padding:60px;display:flex;justify-content:center;align-items:flex-end;gap:70px}
.noir{background:#0E0D0D}.sand{background:#F1EFEB}.white{background:#fff}
svg,img{display:block}
</style></head><body>
<div class="row white"><img src="wordmark-trim.png" style="height:150px" alt="Rerun wordmark"></div>
<div class="row sand"><svg data-w="band" data-h="150" fill="#171616"></svg></div>
<div class="row noir"><svg data-w="band" data-h="150" fill="#fff"></svg></div>
<div class="row sand"><svg data-w="spaced" data-h="90" fill="#171616"></svg><svg data-w="band" data-h="90" fill="#171616"></svg><svg data-w="band" data-h="40" fill="#171616"></svg><svg data-w="band" data-h="22" fill="#171616"></svg></div>
<script src="blank-band.js"></script><script>
for (const s of document.querySelectorAll("svg")) { const w = BAND[s.dataset.w], h = +s.dataset.h;
  s.setAttribute("viewBox", `0 0 ${w.width} ${w.height}`); s.style.height = h + "px"; s.style.width = (h * w.width / w.height) + "px";
  s.setAttribute("fill-rule", "evenodd"); s.innerHTML = `<path d="${w.path}"/>`; }
document.title = "ready";
</script></body></html>
